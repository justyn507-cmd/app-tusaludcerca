<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="description"
      content="SaludCerca reúne opciones de atención privada, servicios de laboratorio, farmacia, bienestar y movilidad para organizar mejor tu salud."
    />
    <title>SaludCerca | Tu salud, tus opciones, todo más cerca</title>
    <style>
      :root {
        --primary: #0f766e;
        --primary-dark: #0b5e58;
        --secondary: #e6fffb;
        --accent: #2563eb;
        --bg: #f4f7f9;
        --surface: #ffffff;
        --text: #17202a;
        --muted: #64748b;
        --line: #dce5ea;
        --success: #15803d;
        --warning: #b45309;
        --danger: #b91c1c;
        --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        --radius: 18px;
        --font-scale: 1;
      }

      * {
        box-sizing: border-box;
      }

      html {
        font-size: calc(16px * var(--font-scale));
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background: var(--bg);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      select {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      a:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.35);
        outline-offset: 2px;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        min-height: 72px;
        padding: 10px 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background: rgba(255, 255, 255, 0.96);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 220px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: var(--primary);
        color: white;
        font-size: 1.45rem;
        box-shadow: var(--shadow);
      }

      .brand strong {
        display: block;
        font-size: 1.1rem;
      }
      .brand small {
        color: var(--muted);
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .chip,
      .icon-btn {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 12px;
      }

      .icon-btn {
        min-width: 42px;
      }

      .role-switch {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 10px;
        background: var(--secondary);
        border-radius: 14px;
      }

      .role-switch span {
        color: var(--primary-dark);
        font-size: 0.83rem;
        font-weight: 700;
      }

      .role-switch select {
        border: 1px solid #99d8d0;
        border-radius: 10px;
        padding: 8px 10px;
        background: white;
        color: var(--text);
      }

      .layout {
        display: grid;
        grid-template-columns: 270px 1fr;
        min-height: calc(100vh - 72px);
      }

      .sidebar {
        position: sticky;
        top: 72px;
        height: calc(100vh - 72px);
        overflow-y: auto;
        padding: 20px 16px;
        background: #0f2430;
        color: white;
      }

      .user-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px;
        margin-bottom: 18px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.08);
      }

      .avatar {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #ccfbf1;
        color: #0f766e;
        font-weight: 900;
      }

      .user-card strong,
      .user-card small {
        display: block;
      }
      .user-card small {
        color: #b8c8d1;
        margin-top: 2px;
      }

      #nav {
        display: grid;
        gap: 6px;
      }

      .nav-link {
        width: 100%;
        border: 0;
        text-align: left;
        padding: 12px 14px;
        border-radius: 12px;
        color: #dbe7ed;
        background: transparent;
        transition: 0.18s ease;
      }

      .nav-link:hover,
      .nav-link.active {
        color: white;
        background: rgba(255, 255, 255, 0.12);
        transform: translateX(2px);
      }

      .danger-soft {
        color: #fecaca;
      }
      .sidebar-footer {
        margin-top: 24px;
      }
      .sidebar-footer p {
        color: #8fa3af;
        font-size: 0.75rem;
        line-height: 1.45;
        padding: 0 8px;
      }

      .main {
        min-width: 0;
        padding: 28px;
      }

      .view {
        max-width: 1300px;
        margin: 0 auto;
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 18px;
        margin-bottom: 22px;
      }

      .page-header h1 {
        margin: 0 0 6px;
        font-size: clamp(1.55rem, 2.3vw, 2.25rem);
      }
      .page-header p {
        margin: 0;
        color: var(--muted);
        max-width: 760px;
        line-height: 1.55;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .btn {
        border: 0;
        border-radius: 12px;
        padding: 11px 16px;
        font-weight: 800;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
      }
      .btn-primary {
        background: var(--primary);
        color: white;
      }
      .btn-secondary {
        background: #e7eef5;
        color: #1e293b;
      }
      .btn-accent {
        background: var(--accent);
        color: white;
      }
      .btn-danger {
        background: var(--danger);
        color: white;
      }
      .btn-success {
        background: var(--success);
        color: white;
      }
      .btn-outline {
        background: white;
        color: var(--primary);
        border: 1px solid #99d8d0;
      }
      .btn-sm {
        padding: 8px 11px;
        font-size: 0.86rem;
      }

      .grid {
        display: grid;
        gap: 18px;
      }

      .grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .grid-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .grid-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px;
      }

      .card h2,
      .card h3 {
        margin-top: 0;
      }
      .card p {
        line-height: 1.55;
      }

      .stat {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .stat-icon {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: var(--secondary);
        font-size: 1.35rem;
      }

      .stat strong {
        display: block;
        font-size: 1.35rem;
      }
      .stat span {
        color: var(--muted);
        font-size: 0.86rem;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: 28px;
        background: linear-gradient(135deg, #0f766e, #155e75);
        color: white;
        border-radius: 24px;
        box-shadow: var(--shadow);
        margin-bottom: 20px;
      }

      .hero::after {
        content: "";
        position: absolute;
        right: -55px;
        top: -75px;
        width: 230px;
        height: 230px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
      }

      .hero h1 {
        margin: 0 0 10px;
        font-size: clamp(1.7rem, 3vw, 2.6rem);
      }
      .hero p {
        max-width: 760px;
        color: #e6fffb;
        line-height: 1.6;
      }
      .hero .actions {
        position: relative;
        z-index: 1;
        margin-top: 18px;
      }

      .alert {
        padding: 14px 16px;
        border-radius: 14px;
        margin: 14px 0;
        border-left: 5px solid;
      }

      .alert-info {
        background: #eff6ff;
        border-color: #2563eb;
        color: #1e3a8a;
      }
      .alert-warning {
        background: #fff7ed;
        border-color: #f59e0b;
        color: #7c2d12;
      }
      .alert-danger {
        background: #fef2f2;
        border-color: #dc2626;
        color: #7f1d1d;
      }
      .alert-success {
        background: #f0fdf4;
        border-color: #22c55e;
        color: #14532d;
      }

      .timeline {
        position: relative;
        display: grid;
        gap: 14px;
      }

      .timeline-item {
        display: grid;
        grid-template-columns: 38px 1fr;
        gap: 12px;
      }

      .timeline-dot {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--secondary);
        color: var(--primary);
        font-weight: 900;
      }

      .timeline-content {
        padding: 12px 14px;
        background: #f8fafc;
        border-radius: 14px;
        border: 1px solid var(--line);
      }

      .timeline-content strong {
        display: block;
        margin-bottom: 4px;
      }
      .timeline-content small {
        color: var(--muted);
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 680px;
      }

      th,
      td {
        text-align: left;
        padding: 13px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      th {
        color: #475569;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: #f8fafc;
      }

      tbody tr:hover {
        background: #fbfdff;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 6px 9px;
        font-size: 0.77rem;
        font-weight: 800;
      }

      .badge-success {
        color: #166534;
        background: #dcfce7;
      }
      .badge-warning {
        color: #92400e;
        background: #fef3c7;
      }
      .badge-info {
        color: #1d4ed8;
        background: #dbeafe;
      }
      .badge-neutral {
        color: #475569;
        background: #e2e8f0;
      }
      .badge-danger {
        color: #991b1b;
        background: #fee2e2;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .form-group {
        display: grid;
        gap: 7px;
      }

      .form-group.full {
        grid-column: 1 / -1;
      }

      label {
        font-weight: 800;
        color: #334155;
        font-size: 0.9rem;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        padding: 11px 12px;
        background: white;
        color: var(--text);
      }

      textarea {
        min-height: 110px;
        resize: vertical;
      }

      .kpi {
        border-left: 5px solid var(--primary);
      }

      .kpi strong {
        display: block;
        font-size: 1.7rem;
        margin-top: 7px;
      }

      .kpi small {
        color: var(--muted);
      }

      .service-card {
        display: grid;
        gap: 10px;
        min-height: 210px;
      }

      .service-icon {
        font-size: 2rem;
      }
      .service-card p {
        color: var(--muted);
        margin: 0;
      }
      .service-card .btn {
        margin-top: auto;
        justify-self: start;
      }

      .doctor-card {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 14px;
        align-items: start;
      }

      .doctor-photo {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: #dbeafe;
        font-size: 1.4rem;
      }

      .doctor-meta {
        color: var(--muted);
        font-size: 0.86rem;
        margin: 4px 0 10px;
      }

      .progress {
        height: 9px;
        background: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
      }

      .progress > span {
        display: block;
        height: 100%;
        background: var(--primary);
        border-radius: inherit;
      }

      .result-row {
        display: grid;
        grid-template-columns: 1fr 120px 150px;
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid var(--line);
      }

      .result-row:last-child {
        border-bottom: 0;
      }
      .result-row strong {
        display: block;
      }
      .result-row small {
        color: var(--muted);
      }

      .video-shell {
        display: grid;
        grid-template-columns: 1fr 290px;
        gap: 16px;
      }

      .video-stage {
        min-height: 390px;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        border-radius: 20px;
        background:
          radial-gradient(
            circle at top left,
            rgba(255, 255, 255, 0.16),
            transparent 35%
          ),
          linear-gradient(145deg, #0f2430, #173f4d);
        color: white;
      }

      .video-person {
        text-align: center;
      }
      .video-person .big-avatar {
        width: 110px;
        height: 110px;
        display: grid;
        place-items: center;
        margin: 0 auto 12px;
        border-radius: 50%;
        background: #ccfbf1;
        color: #0f766e;
        font-size: 2rem;
        font-weight: 900;
      }

      .video-controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 20px;
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      .circle-btn {
        width: 46px;
        height: 46px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        color: white;
      }

      .circle-btn.end {
        background: #dc2626;
      }

      .chat-panel {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: white;
        display: flex;
        flex-direction: column;
        min-height: 390px;
      }

      .chat-messages {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
      }

      .message {
        width: fit-content;
        max-width: 88%;
        padding: 10px 12px;
        border-radius: 14px;
        margin-bottom: 10px;
        background: #e2e8f0;
      }

      .message.me {
        margin-left: auto;
        background: var(--secondary);
        color: var(--primary-dark);
      }

      .chat-input {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid var(--line);
      }

      .chat-input input {
        min-width: 0;
      }

      .empty {
        text-align: center;
        padding: 40px 20px;
        color: var(--muted);
      }

      .empty-icon {
        font-size: 2.6rem;
        margin-bottom: 10px;
      }

      .summary-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .summary-list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px dashed var(--line);
      }

      .summary-list li:last-child {
        border-bottom: 0;
      }
      .summary-list span {
        color: var(--muted);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 80;
        background: rgba(15, 23, 42, 0.58);
      }

      .modal {
        position: fixed;
        z-index: 90;
        width: min(780px, calc(100vw - 30px));
        max-height: calc(100vh - 40px);
        overflow: auto;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 20px;
        background: white;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.35);
      }

      .modal-header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 17px 20px;
        background: white;
        border-bottom: 1px solid var(--line);
      }

      .modal-header h2 {
        margin: 0;
      }
      .modal-body {
        padding: 20px;
      }

      .hidden {
        display: none !important;
      }

      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 110;
        max-width: 380px;
        padding: 13px 16px;
        border-radius: 13px;
        background: #0f2430;
        color: white;
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(15px);
        pointer-events: none;
        transition: 0.22s ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .mobile-only {
        display: none;
      }

      body.high-contrast {
        --bg: #000;
        --surface: #0a0a0a;
        --text: #fff;
        --muted: #d1d5db;
        --line: #535353;
        --secondary: #003f3a;
        --shadow: none;
      }

      body.high-contrast .topbar,
      body.high-contrast input,
      body.high-contrast select,
      body.high-contrast textarea,
      body.high-contrast .timeline-content,
      body.high-contrast .chat-panel,
      body.high-contrast .modal,
      body.high-contrast .modal-header {
        background: #0a0a0a;
        color: #fff;
      }

      body.high-contrast th {
        background: #111;
        color: #fff;
      }
      body.high-contrast tbody tr:hover {
        background: #111;
      }
      body.high-contrast .btn-secondary {
        background: #333;
        color: #fff;
      }

      @media (max-width: 1050px) {
        .grid-4 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .grid-3 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .video-shell {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 820px) {
        .mobile-only {
          display: inline-grid;
          place-items: center;
        }
        .topbar {
          padding: 10px 14px;
        }
        .brand small,
        .role-switch span {
          display: none;
        }
        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: fixed;
          z-index: 70;
          top: 72px;
          left: 0;
          width: 275px;
          transform: translateX(-102%);
          transition: transform 0.22s ease;
        }

        .sidebar.open {
          transform: translateX(0);
        }
        .main {
          padding: 20px 14px;
        }
      }

      @media (max-width: 620px) {
        .brand {
          min-width: 0;
        }
        .brand strong {
          font-size: 0.96rem;
        }
        .top-actions {
          gap: 6px;
        }
        .role-switch {
          padding: 5px;
        }
        .role-switch select {
          max-width: 125px;
        }
        .chip {
          display: none;
        }

        .grid-4,
        .grid-3,
        .grid-2,
        .form-grid {
          grid-template-columns: 1fr;
        }
        .form-group.full {
          grid-column: auto;
        }
        .page-header {
          display: grid;
        }
        .hero {
          padding: 22px;
        }
        .result-row {
          grid-template-columns: 1fr;
        }
      }

      /* SaludCerca 2 · Visual system · No external font or image dependencies */
      :root {
        --primary: #087d74;
        --primary-dark: #075e58;
        --accent: #d5f08a;
        --text: #1b3034;
        --muted: #697b7d;
        --border: #e1e9e7;
        --bg: #f5f8f7;
        --radius: 20px;
        --shadow: 0 8px 28px #123e3506;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        letter-spacing: -0.015em;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #c09a25;
        outline-offset: 3px;
      }
      h1,
      h2,
      h3 {
        letter-spacing: -0.04em;
      }
      h1 {
        font-size: 32px;
      }
      h2 {
        font-size: 21px;
      }
      p {
        line-height: 1.65;
      }
      small {
        line-height: 1.5;
      }
      a {
        color: var(--primary);
      }
      .topbar {
        height: 84px;
        background: #fff;
        border-bottom: 1px solid var(--border);
        padding: 0 36px;
        box-shadow: none;
      }
      .brand-mark {
        background: var(--primary);
        border-radius: 14px;
        box-shadow: none;
        font-size: 26px;
      }
      .brand strong {
        font-size: 23px;
        letter-spacing: -0.8px;
      }
      .brand small {
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      .top-actions {

        margin: 0;

        font-size: 12px;

        color: #214c3a;
        white-space: nowrap;
      }
      .small-label {

        margin-right: 5px;

        display: grid;
        gap: 14px;
      }

        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 12px;
      }
      .record-head h2 {
        margin: 0 0 6px;

      }
      .record-head p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

        height: 18px;
      }
      .bottomnav {
        display: none;
      }
      .toast {
        background: #163e34;
        border-radius: 12px;
      }
      .sync-label {
        font-size: 10px;
        color: #83938b;
      }
      .portal-title {
        font-size: 12px;
        margin: 25px 12px 8px;
        color: var(--muted);
      }

        gap: 18px;
        justify-content: center;
        margin: 28px 0 5px;
        flex-wrap: wrap;

      .high-contrast {
        --text: #071b16;
        --muted: #344f43;
        --border: #749786;
        --bg: #fff;

      .high-contrast .small-label,
      .high-contrast .sync-label {
        color: #344f43;
      }
      .high-contrast .hero-new {
        background: #e1efdf;
      }
      .bigtext {
        font-size: 115%;
      }
      .camera-preview {

      .file-name {

      }
      .summary-list strong {

      .mobile-only {
        display: none;

          font-size: 48px;

          padding: 25px;

        }

        }

          gap: 10px;

        }

          padding: 9px;
        }

          width: 15px;

          padding: 5px 9px;

          color: #067d64;

          grid-template-columns: 1fr;

          grid-column: auto;
        }
        .page-header h1 {
          font-size: 28px;
        }
        .record-head {
          flex-wrap: wrap;
        }
        .grid-4,

          grid-template-columns: 1fr;

          gap: 8px;

        .modal-body {
          padding: 18px;
        }
        .modal-header {
          padding: 18px;
        }
        .hero-new p {
          font-size: 13px;
        }
        .top-actions .chip {
          padding: 7px;
        }
        .steps {
          gap: 8px;
        }
        .page-header .actions {
          margin-top: 12px;
        }
        .service-tile .service-symbol {
          padding: 9px;
        }

      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
          animation: none !important;
        }
      }

        color: var(--muted);

        max-width: 20px;
      }

      }

        background: #e1efdf;

      }

        background: #fff;

          display: flex;
        }

          font-size: 20px;
        }

        }
      }

        };
        const roleData = {

            ["dashboard", "Inicio"],

          ],

            ["dashboard", "Inicio"],

            ["requestsAdmin", "Gestiones integrales"],
            ["manageServices", "Servicios"],
            ["reports", "Reportes"],
            ["audit", "Actividad"],
          ],
        };


        // Catálogo por categoría de servicio.
        const integralServices = {
          clinic: {title:"Clínicas privadas",icon:"home",view:"clinic",summary:"Consultas y servicios ambulatorios de clínicas participantes.",detail:"Búsqueda y coordinación de citas según agenda del establecimiento. La confirmación requiere un acuerdo e integración real.",sample:"Clínica privada participante",phase:"Desarrollo de red"},
          hospital: {title:"Hospitales privados",icon:"home",view:"hospital",summary:"Orientación hacia servicios hospitalarios privados programados.",detail:"Solicitud de información para consultas o procedimientos electivos. No incluye triaje, camas ni urgencias hospitalarias.",sample:"Hospital privado participante",phase:"Desarrollo de red"},
          physiotherapy: {title:"Fisioterapia",icon:"heart",view:"physiotherapy",summary:"Sesiones presenciales o domiciliarias con profesionales autorizados.",detail:"Evaluación inicial y sesiones programadas de fisioterapia, según indicación y criterio del profesional.",sample:"Centro o profesional de fisioterapia",phase:"Expansión progresiva"},

        ];
        let catalogSearch="";

        function loadState() {
          try {
            const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
            if (!raw || raw.version !== 2) return structuredClone(defaultState);
            const merged = { ...structuredClone(defaultState), ...raw };
            for (const key of [
              "appointments",
              "labOrders",
              "labResults",
              "prescriptions",
              "notifications",
              "audit",
              "pharmacyOrders",
              "coordinationRequests",
              "notes",
            ]) {
              if (!Array.isArray(merged[key])) merged[key] = [];
            }
            merged.patient = {
              ...defaultState.patient,
              ...raw.patient,
              caregiver: {
                ...defaultState.patient.caregiver,
                ...raw.patient?.caregiver,
              },
            };
            merged.settings = { ...defaultState.settings, ...raw.settings };
            if(!raw.demoCatalogVersion && merged.settings.homeVisitPrice===35)merged.settings.homeVisitPrice=22;
            if(!raw.demoCatalogVersion)for(const d of merged.doctors){
              const ref=defaultState.doctors.find(x=>x.id===d.id && x.name===d.name);
              if(ref){d.price=ref.price; d.mode=ref.mode;}
            }
            merged.demoCatalogVersion=1;
            return merged;
          } catch {
            return structuredClone(defaultState);
          }
        }

        function saveState(action = "") {

          state.currentView = currentView;

              action,
              role: currentRole,
            });

          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state,(k,v)=>k==="address"?"":v));
          } catch {
            toast(
              "No se pudo guardar. El almacenamiento del navegador está lleno o bloqueado.",
            );
            return false;
          }
          return true;
        }

        function formatDate(dateString) {
          if (!dateString) return "Sin fecha";
          const date = new Date(`${dateString}T12:00:00`);
          return new Intl.DateTimeFormat("es-PA", {
            day: "numeric",
            month: "long",
            year: "numeric",
          }).format(date);
        }

        function money(value) {
          return new Intl.NumberFormat("es-PA", {
            style: "currency",
            currency: "USD",
          }).format(value || 0);
        }

        function statusBadge(status) {
          const s = String(status || "").toLowerCase();
          let cls = "badge-neutral";
          if (s.includes("pend")) cls = "badge-warning";
          else if (
            s.includes("confirm") ||
            s.includes("revis") ||
            s.includes("complet") ||
            s.includes("cargado")
          )
            cls = "badge-success";
          else if (
            s.includes("pend") ||
            s.includes("creada") ||
            s.includes("program")
          )
            cls = "badge-warning";
          else if (s.includes("cancel")) cls = "badge-danger";
          else if (s.includes("proceso") || s.includes("acept"))
            cls = "badge-info";
          return `<span class="badge ${cls}">${escapeHtml(status)}</span>`;
        }

        function escapeHtml(value) {
          return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        function toast(message) {
          const el = $("#toast");
          el.textContent = message;
          el.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
        }

        function openModal(title, html) {
          focusBeforeModal = document.activeElement;
          $("#modalTitle").textContent = title;
          $("#modalBody").innerHTML = html;
          $("#modalBackdrop").classList.remove("hidden");
          $("#modal").classList.remove("hidden");
          $("#app").inert = true;
          document.body.style.overflow = "hidden";
          $("#closeModalBtn").focus();
        }

        function closeModal() {
          if (cameraStream) {
            cameraStream.getTracks().forEach((t) => t.stop());
            cameraStream = null;
          }
          $("#modalBackdrop").classList.add("hidden");
          $("#modal").classList.add("hidden");
          $("#modalBody").innerHTML = "";
          $("#app").inert = false;
          document.body.style.overflow = "";
          if (focusBeforeModal?.isConnected) focusBeforeModal.focus();
        }

        function applyAccessibility() {
          document.documentElement.style.setProperty(
            "--font-scale",
            state.accessibility.largeText ? "1.14" : "1",
          );
          document.body.classList.toggle(
            "high-contrast",
            !!state.accessibility.highContrast,
          );
        }

          if (!roleData[role]) return;

        function setView(view) {
          if (!views[currentRole]?.[view]) return;

          render();

          window.scrollTo({ top: 0, behavior: "smooth" });

          const url = URL.createObjectURL(

          a.href = url;
          a.download = name;

        function submitPharmacy(e) {
          e.preventDefault();
          const form = e.target;
          const f = new FormData(form);
          const file = f.get("attachment");
          if (file?.size > 1024 * 1024)
            return toast("El adjunto debe pesar menos de 1 MB.");
          if (
            file?.size &&
            !["application/pdf", "image/jpeg", "image/png"].includes(file.type)
          )
            return toast("Adjunta un PDF, JPG o PNG.");
          const button = form.querySelector("button[type=submit]");
          button.disabled = true;
          const commit = (attachment) => {
            state.pharmacyOrders.unshift({
              id: uid("FAR"),
              items: f.get("items"),
              address: f.get("address"),
              phone: f.get("phone"),
              deliveryMode: f.get("deliveryMode") || "Por coordinar",
              attachment,
              status: "Pendiente de envío",
              createdAt: new Date().toISOString(),
            });
            notify("Solicitud de farmacia guardada. Pendiente de envío.");
            if (saveState("Solicitud de farmacia guardada")) {
              render();
              toast("Solicitud guardada en este dispositivo.");
            } else {
              state.pharmacyOrders.shift();
              button.disabled = false;
            }
          };
          if (file?.size) {
            const reader = new FileReader();
            reader.onload = () =>
              commit({ name: file.name, type: file.type, data: reader.result });
            reader.onerror = () => {
              button.disabled = false;
              toast("No se pudo leer el archivo.");
            };
            reader.readAsDataURL(file);
          } else commit(null);
        }

        async function testCamera() {
          const label = $("#cameraStatus");
          if (!label) return;
          if (cameraStream) {
            cameraStream.getTracks().forEach((t) => t.stop());
            cameraStream = null;
            $("#cameraPreview").hidden = true;
            label.textContent = "Cámara apagada.";
            return;
          }
          if (!navigator.mediaDevices?.getUserMedia) {
            label.textContent =
              "Para usar la cámara, permite el acceso en tu navegador.";
            return;
          }
          label.textContent = "Esperando permiso para usar la cámara…";
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: true,
              audio: false,
            });
            if (!$("#cameraPreview")) {
              stream.getTracks().forEach((t) => t.stop());
              return;
            }
            cameraStream = stream;
            $("#cameraPreview").srcObject = stream;
            $("#cameraPreview").hidden = false;
            label.textContent =
              "Vista de cámara activa. Pulsa de nuevo para apagar.";
          } catch {
            if (label.isConnected)
              label.textContent =
                "No se pudo acceder a la cámara. Revisa el permiso del navegador.";
          }
        }

            id: uid("N"),
            appointmentId: a.id,

              homeService: true,
              scheduledDate: "",
              scheduledTime: "",
              laboratory: "",

            id: uid("IND"),
            appointmentId: a.id,
            doctorName: a.doctorName,

        function submitPrescription(event) {
          event.preventDefault();
          const data = Object.fromEntries(new FormData(event.target));
          state.prescriptions.unshift({
            id: `RX-${Date.now().toString().slice(-6)}`,
            doctorName: "Equipo médico",
            date: new Date().toISOString().slice(0, 10),
            medication: data.medication,
            instructions: data.instructions,
            status: "Borrador",
          });
          saveState("Borrador de indicación guardado");
          render();
          toast("Indicación guardada.");
        }

        function submitResult(e) {
          e.preventDefault();
          const f = Object.fromEntries(new FormData(e.target));
          const o = state.labOrders.find(
            (o) => o.id === f.orderId && o.status === "Muestra tomada",
          );
          if (!o)
            return toast(
              "La orden no tiene una muestra pendiente de resultado.",
            );
          state.labResults.unshift({
            id: uid("RES"),
            orderId: o.id,
            testName: f.testName,
            date: localDate(),
            status: "Pendiente de revisión médica",
            doctorComment: "",
            labComment: f.comment,
            values: [
              {
                name: f.parameter,
                value: f.value,
                range: f.range,
                flag: "review",
              },
            ],
          });

          event.preventDefault();
          const data = Object.fromEntries(new FormData(event.target));
          state.doctors.push({
            id: `D-${Date.now().toString().slice(-5)}`,
            name: data.name,
            specialty: data.specialty,
            license: data.license,
            experience: "Perfil nuevo",
            mode: "Virtual",
            price: Number(data.price),

            available: true,
          });

            ...state.settings,

            homeVisitPrice: Number(fd.get("homeVisitPrice")),

        function handleAction(action, id) {
          const a = state.appointments.find((a) => a.id === id);
          const o = state.labOrders.find((o) => o.id === id);
          switch (action) {
            case "showProviders": document.getElementById("demoDirectory")?.scrollIntoView({behavior:"smooth"}); break;
            case "clearCatalog":
              catalogSearch = "";
              render();
              break;
            case "requestService":
              requestServiceDialog(id);
              break;
            case "requestDetail":
              requestDetails(id);
              break;
            case "cancelRequest": {
              const x=state.coordinationRequests.find(x=>x.id===id);
              if(x)openModal('Cancelar solicitud', `<p>¿Deseas cancelar la solicitud ${escapeHtml(x.id)}?</p><button class="btn btn-primary" data-action="confirmRequestCancel" data-id="${escapeHtml(x.id)}">Cancelar gestión</button>`);
              break;
            }
            case "confirmRequestCancel": {
              const x=state.coordinationRequests.find(x=>x.id===id);
              if(x){x.status='Cancelada';saveState('Cancelación local '+x.id);closeModal();render();toast('Solicitud cancelada.');}
              break;

            case "help":

                  )

                    "",
                  )}</div><p class="small-label">Selecciona el área de trabajo que deseas consultar.</p>`,
              );
              break;
            case "switchRole":
              setRole(id);
              break;
            case "notifications":
              currentView = "notifications";
              saveState();
              render();
              break;
            case "readAll":
              state.notifications.forEach((n) => (n.read = true));
              saveState();
              render();
              break;
            case "readNotification": {
              const n = state.notifications.find(

              saveState();
              render();

              render();
              break;

            case "reschedule":

            case "cancelAppointment":

                openModal(
                  "Cancelar solicitud",

                );
              }
              break;
            case "confirmCancel":
              if (a) {
                a.status = "Cancelada";
                notify("Solicitud cancelada en este dispositivo.");

                closeModal();
                render();
                toast("Solicitud cancelada.");

            case "calendar":

              }
              break;

              if (a && !["Cancelada", "Completada"].includes(a.status)) {
                selectedAppointment = id;

            case "reviewResult": {

              );

              state.patient.caregiver.permissions = {

                results: false,

              render();
              toast("Preferencias revocadas.");

                );
              }
              break;
            }
            case "confirmPharmacyCancel": {
              const p = state.pharmacyOrders.find((p) => p.id === id);
              if (p) {
                p.status = "Cancelada";
                saveState();
                closeModal();
                render();
              }
              break;
            }
            case "attachment": {
              const p = state.pharmacyOrders.find((p) => p.id === id);
              if (
                p?.attachment &&
                /^data:(application\/pdf|image\/(png|jpeg));base64,/.test(
                  p.attachment.data,
                )
              ) {
                const a = document.createElement("a");
                a.href = p.attachment.data;
                a.download = p.attachment.name;
                a.click();
              }
              break;
            }
            case "toggleDoctor": {
              const d = state.doctors.find((d) => d.id === id);
              if (d) {
                d.available = !d.available;
                saveState("Disponibilidad del perfil actualizada");
                render();

            case "openPatientRecord":
              openModal(
                "Datos del paciente",
                `<h3>${escapeHtml(state.patient.name || "Sin nombre")}</h3><p>Alergias: ${escapeHtml(state.patient.allergies || "Sin registrar")}</p><p>Antecedentes: ${escapeHtml(state.patient.conditions || "Sin registrar")}</p>`,

        function downloadResultFile(id) {
          const r = state.labResults.find((r) => r.id === id);
          if (!r) return;
          download(
            `${r.id}.txt`,
            [
              `${state.settings.appName} · Registro local`,
              r.id,
              r.testName,
              formatDate(r.date),
              ...r.values.map((v) => `${v.name}: ${v.value} (${v.range})`),
              `Laboratorio: ${r.labComment || ""}`,
              `Revisión: ${r.review || "Pendiente"}`,
              "Registro local sin validación ni firma clínica.",
            ].join("\n"),
            "text/plain",
          );
        }

        function initGlobalEvents() {
          document.addEventListener("click", (e) => {
            const el = e.target.closest("[data-view],[data-action]");
            if (!el) return;
            if (el.dataset.view) setView(el.dataset.view);
            else handleAction(el.dataset.action, el.dataset.id);
          });
          $("#menuBtn").addEventListener("click", () =>
            $("#sidebar").classList.toggle("open"),
          );
          $("#closeModalBtn").addEventListener("click", closeModal);
          $("#modalBackdrop").addEventListener("click", closeModal);
          $("#fontBtn").addEventListener("click", () => {
            state.accessibility.largeText = !state.accessibility.largeText;
            applyAccessibility();
            saveState();
          });
          $("#contrastBtn").addEventListener("click", () => {
            state.accessibility.highContrast =
              !state.accessibility.highContrast;
            applyAccessibility();
            saveState();
          });
          document.addEventListener("change", (e) => {
            if (e.target.id === "bookMode") {
              $("#addressGroup").hidden = e.target.value === "Videollamada";
              $("#bookAddress").required = e.target.value !== "Videollamada";
            }
          });
          document.addEventListener("submit", (e) => {
            const id = e.target.id;
            const f = Object.fromEntries(new FormData(e.target));
            if (id === "coordinationForm") {
              submitCoordination(e);
              return;
            }
            if (id === "zoneForm") {
              e.preventDefault();
              state.zone = f.zone;
              saveState();
              closeModal();
              render();
            }
            if (id === "reviewForm") {
              e.preventDefault();
              const r = state.labResults.find((r) => r.id === f.id);
              if (r) {
                r.review = f.review;
                r.status = "Revisado por médico";
                notify("Se guardó una revisión de resultado.");
                saveState("Revisión local de resultado");
                closeModal();
                render();
              }
            }
            if (id === "labBooking") {
              e.preventDefault();
              const o = state.labOrders.find((o) => o.id === f.orderId);
              if (!o) return;
              if (f.date <= localDate())
                return toast("Elige una fecha a partir de mañana.");
              Object.assign(o, {
                scheduledDate: f.date,
                scheduledTime: f.time,
                address: f.address,
                zone: f.zone,
                status: "Solicitud guardada",
                laboratory: "Por asignar",
              });
              notify("Solicitud de laboratorio guardada. Pendiente de envío.");
              saveState("Solicitud domiciliaria guardada");
              closeModal();
              render();
            }
          });
          document.addEventListener("keydown", (e) => {
            if ($("#modal").classList.contains("hidden")) return;
            if (e.key === "Escape") closeModal();
            if (e.key === "Tab") {
              const focus = [
                ...$("#modal").querySelectorAll(
                  "button,input,select,textarea,a[href]",
                ),
              ].filter((x) => !x.disabled && x.getClientRects().length);
              const first = focus[0],
                last = focus.at(-1);
              if (e.shiftKey && document.activeElement === first) {
                e.preventDefault();
                last?.focus();
              } else if (!e.shiftKey && document.activeElement === last) {
                e.preventDefault();
                first?.focus();
              }
            }
          });
          window.addEventListener("storage", (e) => {
            if (e.key === STORAGE_KEY && e.newValue) {
              state = loadState();
              if ($("#modal").classList.contains("hidden")) render();
              else
                toast(
                  "Hay cambios en otra pestaña. Revisa tu solicitud antes de guardar.",
                );
            }
          });
          window.addEventListener("pagehide", () =>
            cameraStream?.getTracks().forEach((t) => t.stop()),
          );
        }

function makeProvider(key,i,name,rates,title,description,photo,degree,interest) {
  const site=["Centro Jardines","Centro Brisas","Centro Mirador"][i];
  return {id:key+"-"+(i+1),key,name,rates,title,description,photo,site:site+" · Santiago, Veraguas",
    hours:pricing.hours[i],offset:i,
    training:degree ? degree+" · Universidad Demostrativa del Istmo" : "",
    experience:degree ? (5+i*3)+" años en "+interest : "",
    background:degree ? "Atención centrada en "+interest+" en "+site+"." : "",
    license:degree ? "DEMO-"+key.toUpperCase()+"-00"+(i+1)+" — sin validez profesional" : ""};
}
function providers(key){
  if(key==="med")return state.doctors.filter(d=>d.available).map((d,i)=>{
    const seed=defaultState.doctors.findIndex(s=>s.id===d.id&&s.name===d.name);
    const m=medDetails[seed], p=makeProvider(key,i%3,d.name,seed===0?{...m[1],[H]:state.settings.homeVisitPrice}:m?.[1]||{[V]:d.price},d.specialty,
      m?"Consulta de "+d.specialty.toLowerCase()+".":"Consulta con profesional del directorio.",0,
      m?"Doctorado en Medicina"+(seed?" y especialidad en "+d.specialty:""):"",m?.[2]);
    return {...p,id:d.id,license:m?"DEMO-MED-00"+(seed+1)+" — sin validez profesional":"",experience:m?p.experience:d.experience};
  });
  const [title,desc,photo,names,rates,degree,interests]=categoryData[key];
  return names.map((n,i)=>makeProvider(key,i,n,rates[i],title,desc,photo,degree,interests?.split("|")[i]));
}
function demoPhoto(p){
  return '<img class="demo-photo" alt="Fotografía ilustrativa del entorno de atención" src="'+photos[p.photo]+'">';
}
const demoLabel='<p class="small-label">'+demoNotice+'</p>';
function displayMode(p,m){return m===C && (p.training||p.key==="med")?"Presencial en consultorio":m;}
function rateList(p){return Object.entries(p.rates).map(([m,v])=>escapeHtml(displayMode(p,m))+" · "+(m===T?"desde ":"")+money(v)+(m===H?" + desplazamiento":"")).join("<br>");}
function demoCard(p){
  return '<article class="card">'+demoPhoto(p)+'<h2>'+escapeHtml(p.name)+'</h2><p>'+escapeHtml(p.title)+'</p><p>'+escapeHtml(p.site)+'</p><p>'+rateList(p)+'</p><button class="btn btn-secondary" data-profile="'+escapeHtml(p.id)+'" data-group="'+p.key+'">Ver perfil y horarios</button> <button class="btn btn-primary" data-start="'+escapeHtml(p.id)+'" data-group="'+p.key+'">'+(T in p.rates?"Cotizar":"Elegir")+'</button></article>';
}
function demoGrid(key){return demoLabel+'<div class="provider-grid">'+providers(key).map(demoCard).join("")+'</div>';}
function demoProfile(p){
  openModal(p.name,demoPhoto(p)+demoLabel+'<h3>'+escapeHtml(p.title)+'</h3><p>'+escapeHtml(p.description)+'</p><p>'+escapeHtml(p.background)+'</p>'+
    [p.training,p.experience,p.license,p.site,"Agenda diaria simulada · "+p.hours.join(" / ")].filter(Boolean).map(x=>'<p>'+escapeHtml(x)+'</p>').join("")+
    '<p>'+rateList(p)+'</p><button class="btn btn-primary" data-group="'+p.key+'" data-start="'+escapeHtml(p.id)+'">Seleccionar modalidad y fecha</button>');
}

let draft=null;
const providerFor=b=>providers(b.key).find(p=>p.id===b.provider);
const isHome=b=>b.mode===H;
function zoneList(p){
  return pricing.zones.map(([name,km])=>[name,km+p.offset*2]);
}
function priceBreakdown(b,p){
  const base=p.rates[b.mode];
  if(base===undefined)return {state:"invalid"};
  if(b.mode!==H && b.mode!==T)return {state:"ready",base,total:base};
  const requestedZone=b.zone||b.address?.trim()||"";
  const zone=zoneList(p).find(([name])=>fold(name)===fold(requestedZone));
  const km=isHome(b)?zone?.[1]:undefined;
  if(!zone&&!b.address?.trim()&&!b.hasLocation)return {state:"missing",base};
  if(isHome(b)&&km>pricing.bands.at(-1)[0])return {state:"outside",base,km};
  const fee=b.mode===T || km===undefined ? null : pricing.bands.find(([limit])=>km<=limit)?.[1];
  if(fee==null && !b.quoted)return {state:"quote",base,km};
  const extra=fee??(isHome(b)?pricing.quotedVisit:pricing.quotedTransportSupplement);
  return {state:"ready",base,km,extra,total:base+extra};
}
function slots(b,p){
  if(!p||b.date<=localDate())return [];
  return p.hours.filter(time=>![...state.appointments,...state.coordinationRequests].some(r=>
    r.id!==b.oldId && r.status!=="Cancelada" && r.status!==pendingQuote &&
    (r.doctorId||r.demo?.provider)===p.id && r.date===b.date && r.time===time));
}
function beginDemo(key,id,oldId=""){
  const p=providers(key).find(x=>x.id===id);
  if(!p)return toast("El proveedor ya no está disponible.");
  const old=state.appointments.find(a=>a.id===oldId);
  draft={key,provider:id,oldId,date:old&&old.date>localDate()?old.date:localDate(1),
    mode:old?.demo?.mode||(old?.mode?.includes("domicilio")&&H in p.rates?H:null)||(key==="med"&&modeFilter==="domicilio"&&H in p.rates?H:Object.keys(p.rates)[0]),
    zone:old?.demo?.zone||"",address:"",time:old?.time||"",person:old?.patientName||state.patient.name||"",phone:state.patient.phone||"",reason:old?.symptoms||""};
  editDemo();
}
const option=(value,current,label=value)=>'<option value="'+escapeHtml(value)+'" '+(value===current?"selected":"")+'>'+escapeHtml(label)+'</option>';
function editDemo(){
  const b=draft,p=providerFor(b);
  if(!p)return toast("El proveedor ya no está disponible.");
  const times=slots(b,p);
  if(!times.includes(b.time)) b.time=times[0]||"";
  openModal("Organiza tu atención",demoLabel+'<form class="form-grid" id="demoForm">'+
    '<label class="form-group full">Proveedor<select name="provider">'+providers(b.key).map(x=>option(x.id,b.provider,x.name)).join("")+'</select></label>'+
    '<label class="form-group full">Modalidad<select name="mode">'+Object.keys(p.rates).map(m=>option(m,b.mode,displayMode(p,m))).join("")+'</select></label>'+
    (isHome(b)||b.mode===T?'<label class="form-group full">'+(isHome(b)?'Dirección o zona manual':'Origen y destino del traslado')+'<input name="address" maxlength="150" autocomplete="off" value="'+escapeHtml(b.address||"")+'"></label>':'')+
    (isHome(b)?'<label class="form-group full">Zona demostrativa desde '+escapeHtml(p.site)+'<select name="zone">'+option("",b.zone,"Seleccione una zona o escriba una dirección")+zoneList(p).map(([n,km])=>option(n,b.zone,n+" · "+km+" km simulados")).join("")+'</select></label>':'')+
    '<label class="form-group">Fecha disponible<input type="date" name="date" min="'+localDate(1)+'" value="'+escapeHtml(b.date)+'" required></label>'+
    '<label class="form-group">Horario<select name="time" required>'+times.map(t=>option(t,b.time)).join("")+'</select></label>'+
    (b.key==="med"?'<label class="form-group">Nombre para la cita<input name="person" maxlength="100" placeholder="Paciente demo" value="'+escapeHtml(b.person)+'"></label><label class="form-group">Teléfono opcional<input name="phone" maxlength="20" value="'+escapeHtml(b.phone)+'"></label><label class="form-group full">Motivo de consulta (opcional)<textarea name="reason" maxlength="1200">'+escapeHtml(b.reason)+'</textarea></label>':'')+
    '<div class="form-group full" id="demoEstimate" aria-live="polite"></div></form>');
  updateEstimate();
}
function line(label,value){return '<div class="review-line"><span>'+label+'</span><strong>'+escapeHtml(String(value))+'</strong></div>';}
function receipt(b,p,q){
  let html=line("Servicio",p.title)+line("Proveedor",p.name)+line("Modalidad",displayMode(p,b.mode))+line("Fecha y hora",formatDate(b.date)+" · "+(b.time||"Sin disponibilidad"));
  if(isHome(b)||b.mode===T)html+=line("Lugar",b.zone||b.address||(b.hasLocation?"Dirección de la solicitud (privada)":"Pendiente"));
  if(isHome(b))html+=line("Recorrido de ida desde "+escapeHtml(p.site),q.km===undefined?"Sin ruta calculada":q.km+" km simulados");
  html+=line("Precio de la atención",money(q.base));
  if(isHome(b)||b.mode===T)html+=line(isHome(b)?"Desplazamiento (ida y regreso)":"Ajuste por trayecto",q.extra===undefined?"Pendiente":money(q.extra));
  return html+line("Total a pagar",q.total===undefined?"Pendiente":money(q.total));
}
function updateEstimate(){
  const b=draft,p=providerFor(b),q=priceBreakdown(b,p);
  const notes={outside:"Dirección fuera de cobertura. Consulte otro proveedor o modalidad.",missing:isHome(b)?"Desplazamiento pendiente de calcular":"Indique el origen y destino.",quote:"Se requiere cotización previa."};
  $("#demoEstimate").innerHTML=receipt(b,p,q)+(isHome(b)?'<p class="small-label">Tarifas y distancias de demostración, sujetas a validación para la operación real. Cobertura sujeta a disponibilidad y condiciones de acceso.</p>':'')+
    '<p>'+(notes[q.state]||"")+'</p>'+(!b.time?'<p>Sin horarios disponibles. Seleccione otra fecha.</p>':'')+
    '<button class="btn btn-primary" '+(!b.time||!["ready","quote"].includes(q.state)?"disabled":"")+'>'+ (q.state==="quote"?"Solicitar cotización":"Revisar reserva")+'</button>';
}
function demoSummary(){
  const b=draft,p=providerFor(b);
  if(!p)return toast("Proveedor no disponible.");
  if(!slots(b,p).includes(b.time)){editDemo();return toast("Horario no disponible. Elija otra fecha u hora.");}
  const q=priceBreakdown(b,p);
  if(q.state!=="ready")return;
  openModal(b.quoted?"Cotización simulada recibida":"Revisar reserva",demoLabel+receipt(b,p,q)+'<form id="demoAccept"><label class="checks"><span><input type="checkbox" required> Acepto el total y el horario de demostración.</span></label><div class="actions"><button type="button" class="btn btn-secondary" data-edit-demo>Volver</button><button class="btn btn-primary">Confirmar reserva simulada</button></div></form>');
}
function publicDraft(b){
  return {key:b.key,provider:b.provider,mode:b.mode,date:b.date,time:b.time,zone:b.zone,hasLocation:!!(b.address||b.zone||b.hasLocation),quoted:!!b.quoted,oldId:b.oldId};
}
function newRecord(b,p){
  return {service:b.key,date:b.date,time:b.time,mode:b.mode,zone:b.zone||p.site,phone:"",notes:p.name,demo:{...publicDraft(b),title:p.title,name:p.name,site:p.site},createdAt:new Date().toISOString()};
}
function askQuote(){
  const b=draft,p=providerFor(b);
  if(!p||priceBreakdown(b,p).state!=="quote"||!slots(b,p).includes(b.time))return;
  const r={...newRecord(b,p),id:uid("Q"),status:pendingQuote};
  state.coordinationRequests.unshift(r);
  if(!saveState()){state.coordinationRequests.shift();return;}
  b.requestId=r.id;
  showQuote(r);
}
function showQuote(r){
  openModal("Cotización de demostración",demoLabel+line("Proveedor",r.notes)+line("Estado",r.status)+'<p>El horario solicitado se comprobará al aceptar el importe.</p><button class="btn btn-primary" data-quote="'+escapeHtml(r.id)+'">Simular recepción de cotización</button>');
}
function acceptDemo(){
  const b=draft,p=providerFor(b),q=p&&priceBreakdown(b,p);
  const req=b.requestId&&state.coordinationRequests.find(r=>r.id===b.requestId);
  if(b.requestId&&req?.status!==pendingQuote)return toast("La solicitud de cotización ya cambió de estado.");
  if(!p||q.state!=="ready"||!slots(b,p).includes(b.time)){toast("Revise el proveedor y el horario disponible.");if(p)editDemo();return;}
  const previous=structuredClone(state);
  const r={...newRecord(b,p),id:b.oldId||req?.id||uid("C"),status:"Confirmada",amount:q,price:q.total};
  if(b.key==="med"){
    Object.assign(r,{doctorId:p.id,doctorName:p.name,specialty:p.title,patientName:b.person||"Paciente demo",patientId:state.patient.id,
      mode:b.mode===V?"Videollamada":b.mode,address:"",symptoms:b.reason||""});
    state.appointments=state.appointments.filter(x=>x.id!==r.id);
    state.appointments.push(r);
    if(b.person)state.patient.name=b.person;
    if(b.phone)state.patient.phone=b.phone;
  }else{
    state.coordinationRequests=state.coordinationRequests.filter(x=>x.id!==r.id);
    state.coordinationRequests.unshift(r);
  }
  if(req&&b.key==="med")state.coordinationRequests=state.coordinationRequests.filter(x=>x.id!==req.id);
  notify("Reserva simulada "+r.id+" confirmada.");
  if(!saveState("Reserva de demostración "+r.id)){state=previous;return;}
  setView(b.key==="med"?"appointments":"myServices");
  openModal("Reserva confirmada",'<p>'+confirmedNotice+'</p>'+receipt(b,p,q));
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-start],[data-profile],[data-edit-demo],[data-quote]");
  if(!el)return;
  if(el.hasAttribute("data-start"))return beginDemo(el.dataset.group,el.dataset.start);
  if(el.hasAttribute("data-profile")){const p=providers(el.dataset.group).find(x=>x.id===el.dataset.profile);if(p)demoProfile(p);return;}
  if(el.hasAttribute("data-edit-demo"))return editDemo();
  const req=state.coordinationRequests.find(r=>r.id===el.dataset.quote&&r.status===pendingQuote);
  if(!req)return toast("Solicitud no disponible.");
  const same=draft?.requestId===req.id;
  draft={person:"",reason:"",phone:"",address:"",...(same?draft:{}),...req.demo,requestId:req.id,quoted:true};
  const p=providerFor(draft);
  if(!p)return toast("Proveedor no disponible.");
  if(!slots(draft,p).includes(draft.time)){if(draft.date<=localDate())draft.date=localDate(1);editDemo();toast("Seleccione un horario disponible.");return;}
  demoSummary();
});
document.addEventListener("input",e=>{
  if(e.target.form?.id!=="demoForm")return;
  const {name,value}=e.target;
  if(!["address","person","phone","reason"].includes(name))return;
  draft[name]=value;
  if(name==="address"){
    draft.zone="";draft.hasLocation=false;draft.quoted=false;draft.requestId="";
    if(e.target.form.elements.zone)e.target.form.elements.zone.value="";
    updateEstimate();
  }
});
document.addEventListener("change",e=>{
  if(e.target.form?.id!=="demoForm")return;
  const {name,value}=e.target;
  if(!["provider","mode","date","time","zone"].includes(name))return;
  draft[name]=value;
  if(name==="provider"||name==="mode"||name==="zone"){
    draft.requestId="";draft.quoted=false;draft.hasLocation=false;draft.address="";
    if(name!=="zone")draft.zone="";
    if(name==="provider")draft.mode=Object.keys(providerFor(draft).rates)[0];
  }
  editDemo();
  $("#demoForm").elements[name]?.focus();
});
document.addEventListener("submit",e=>{
  if(e.target.id==="demoForm"){
    e.preventDefault();
    if(priceBreakdown(draft,providerFor(draft)).state==="quote")askQuote();else demoSummary();
  }
  if(e.target.id==="demoAccept"){e.preventDefault();acceptDemo();}
});


function showSaved(r){
  if(r.status===pendingQuote)return showQuote(r);
  const b=r.demo;
  openModal("Detalle de la reserva",demoLabel+line("Estado",r.status)+(r.amount?receipt(b,{title:b.title,name:b.name,site:b.site,key:b.key,training:categoryData[b.key]?.[5]},r.amount):line("Proveedor",r.notes))+
  (r.status==="Confirmada"?"<p>"+confirmedNotice+"</p>":"")+(r.doctorId?'<button class="btn btn-secondary" data-action="calendar" data-id="'+escapeHtml(r.id)+'">Descargar recordatorio</button>':""));
}

integralServices.ambulanceScheduled.detail=categoryData.ambulanceScheduled[1];
