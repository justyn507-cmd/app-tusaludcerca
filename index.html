            (a) => a.id === selectedAppointment,
          );
          if (!a || ["Cancelada", "Completada"].includes(a.status))
            return toast("Selecciona una solicitud activa.");
          const f = Object.fromEntries(new FormData(e.target));
          state.notes.unshift({
            id: uid("N"),
            appointmentId: a.id,
            doctorName: a.doctorName,
            note: f.note,
            createdAt: new Date().toISOString(),
          });
          if (f.tests.trim())
            state.labOrders.unshift({
              id: uid("LAB"),
              appointmentId: a.id,
              patientId: a.patientId,
              patientName: a.patientName,
              doctorName: a.doctorName,
              tests: f.tests,
              reason: f.note,
              status: "Orden creada",
              homeService: true,
              scheduledDate: "",
              scheduledTime: "",
              laboratory: "",
              price: 0,
            });
          state.prescriptions.unshift({
            id: uid("IND"),
            appointmentId: a.id,
            doctorName: a.doctorName,
            date: localDate(),
            medication: "Plan de seguimiento",
            instructions: f.instructions + " Seguimiento: " + f.followup,
            status: "Borrador",
          });
          a.status = "Completada";
          notify("Se guardó un registro de atención y seguimiento.");
          if (saveState(`Registro local de atención ${a.id}`)) {
            setView("dashboard");
            toast("Registro guardado.");
          }
        }

        function submitPrescription(event) {
          event.preventDefault();
          const data = Object.fromEntries(new FormData(event.target));
          state.prescriptions.unshift({
            id: `RX-${Date.now().toString().slice(-6)}`,
            doctorName: "Equipo médico",
            date: new Date().toISOString().slice(0, 10),
            medication: data.medication,
            instructions: data.instructions,
            status: "Borrador",
          });
          saveState("Borrador de indicación guardado");
          render();
          toast("Indicación guardada.");
        }

        function submitResult(e) {
          e.preventDefault();
          const f = Object.fromEntries(new FormData(e.target));
          const o = state.labOrders.find(
            (o) => o.id === f.orderId && o.status === "Muestra tomada",
          );
          if (!o)
            return toast(
              "La orden no tiene una muestra pendiente de resultado.",
            );
          state.labResults.unshift({
            id: uid("RES"),
            orderId: o.id,
            testName: f.testName,
            date: localDate(),
            status: "Pendiente de revisión médica",
            doctorComment: "",
            labComment: f.comment,
            values: [
              {
                name: f.parameter,
                value: f.value,
                range: f.range,
                flag: "review",
              },
            ],
          });
          o.status = "Resultado cargado";
          notify("Hay un nuevo resultado pendiente de revisión.");
          if (saveState(`Resultado registrado para ${o.id}`)) {
            setView("dashboard");
            toast("Resultado guardado.");
          }
        }

        function submitDoctor(event) {
          event.preventDefault();
          const data = Object.fromEntries(new FormData(event.target));
          state.doctors.push({
            id: `D-${Date.now().toString().slice(-5)}`,
            name: data.name,
            specialty: data.specialty,
            license: data.license,
            experience: "Perfil nuevo",
            mode: "Virtual",
            price: Number(data.price),

            available: true,
          });
          saveState(`Profesional ${data.name} agregado`);
          render();
          toast("Profesional agregado.");
        }

        function submitSettings(event) {
          event.preventDefault();
          const fd = new FormData(event.target);
          state.settings = {
            ...state.settings,
            appName: fd.get("appName"),
            appointmentPrice: Number(fd.get("appointmentPrice")),
            homeVisitPrice: Number(fd.get("homeVisitPrice")),
            homeLabEnabled: fd.get("homeLabEnabled") === "on",
            pharmacyEnabled: fd.get("pharmacyEnabled") === "on",
            transportEnabled: fd.get("transportEnabled") === "on",
          };
          saveState("Configuración administrativa actualizada");
          render();
          toast("Configuración actualizada.");
        }

        function handleAction(action, id) {
          const a = state.appointments.find((a) => a.id === id);
          const o = state.labOrders.find((o) => o.id === id);
          switch (action) {
            case "clearCatalog":
              catalogSearch = "";
              render();
              break;
            case "requestService":
              requestServiceDialog(id);
              break;
            case "requestDetail":
              requestDetails(id);
              break;
            case "cancelRequest": {
              const x=state.coordinationRequests.find(x=>x.id===id);
              if(x)openModal('Cancelar solicitud', `<p>¿Deseas cancelar la solicitud ${escapeHtml(x.id)}?</p><button class="btn btn-primary" data-action="confirmRequestCancel" data-id="${escapeHtml(x.id)}">Cancelar gestión</button>`);
              break;
            }
            case "confirmRequestCancel": {
              const x=state.coordinationRequests.find(x=>x.id===id);
              if(x){x.status='Cancelada';saveState('Cancelación local '+x.id);closeModal();render();toast('Solicitud cancelada.');}
              break;
            }
            case "book":
              bookDoctor(id);
              break;
            case "bookingBack":
              bookingStep(1);
              break;
            case "doctorInfo": {
              const d = state.doctors.find((d) => d.id === id);
              if (d)
                openModal(
                  "Perfil profesional",
                  `<div class="provider-head"><div class="provider-avatar">${icon("user")}</div><div><h2>${escapeHtml(d.name)}</h2><p>${escapeHtml(d.specialty)}</p></div></div><p>Modalidad: ${escapeHtml(d.mode)}</p><p>Tarifa publicada: ${money(d.price)}</p><p class="small-label">Datos del profesional sujetos a validación por la administración.</p><button class="btn btn-primary" data-action="book" data-id="${d.id}">Solicitar información</button>`,
                );
              break;
            }
            case "directoryInfo":
              openModal(
                "Sobre el directorio",
                "<p>La búsqueda de atención permite revisar especialidades y modalidades. Cada proveedor debe contar con información de contacto, idoneidad y condiciones de servicio validadas antes de publicar su disponibilidad.</p>",
              );
              break;
            case "homeDoctors":
              modeFilter = "domicilio";
              specialtyFilter = "";
              searchQuery = "";
              setView("newAppointment");
              break;
            case "coverage":
              openModal(
                "Zonas de atención",
                `<p>El proyecto contempla iniciar en Santiago y ampliar según los proveedores participantes. Consulta las zonas disponibles para tu solicitud.</p><form id="zoneForm" class="form-grid"><div class="form-group full"><label for="zone">Mi zona de interés</label><select id="zone" name="zone">${["Santiago, Veraguas", "Atalaya", "La Peña", "La Mata", "Otra zona"].map((z) => `<option ${state.zone === z ? "selected" : ""}>${z}</option>`).join("")}</select></div><button class="btn btn-primary">Guardar zona</button></form>`,
              );
              break;
            case "help":
              helpDialog();
              break;
            case "appInfo":
              openModal(
                "SaludCerca en tu celular",
                `<span class="service-symbol">${icon("phone")}</span><h3>Web y app, una misma experiencia</h3><p>Accede a tus gestiones desde el navegador de tu teléfono, computadora o tableta.</p><p>En tu celular, puedes añadir SaludCerca a la pantalla de inicio desde el menú del navegador.</p>`,
              );
              break;
            case "workspace":
              openModal(
                "Espacios de trabajo",
                `<p>Selecciona el espacio que quieres recorrer.</p><div class="grid grid-2">${Object.entries(
                  roleData,
                )
                  .map(
                    ([r, v]) =>
                      `<button class="btn btn-secondary" data-action="switchRole" data-id="${r}">${icon(r === "patient" ? "user" : r === "lab" ? "lab" : "file")}${v.subtitle}</button>`,
                  )
                  .join(
                    "",
                  )}</div><p class="small-label">Selecciona el área de trabajo que deseas consultar.</p>`,
              );
              break;
            case "switchRole":
              setRole(id);
              break;
            case "notifications":
              currentView = "notifications";
              saveState();
              render();
              break;
            case "readAll":
              state.notifications.forEach((n) => (n.read = true));
              saveState();
              render();
              break;
            case "readNotification": {
              const n = state.notifications.find(
                (n) => String(n.id) === String(id),
              );
              if (n) n.read = true;
              saveState();
              render();
              break;
            }
            case "filterAppointments":
              appointmentFilter = id;
              render();
              break;
            case "appointmentDetail":
              actionDetails(id);
              break;
            case "reschedule":
              if (a) bookDoctor(a.doctorId, a.id);
              break;
            case "cancelAppointment":
              if (a && !["Cancelada", "Completada"].includes(a.status)) {
                openModal(
                  "Cancelar solicitud",
                  `<p>¿Deseas cancelar la solicitud con ${escapeHtml(a.doctorName)} del ${formatDate(a.date)}?</p><button class="btn btn-primary" data-action="confirmCancel" data-id="${a.id}">Sí, cancelar solicitud</button>`,
                );
              }
              break;
            case "confirmCancel":
              if (a) {
                a.status = "Cancelada";
                notify("Solicitud cancelada en este dispositivo.");
                saveState(`Cancelación ${a.id}`);
                closeModal();
                render();
                toast("Solicitud cancelada.");
              }
              break;
            case "calendar":
              if (a) {
                const clean = (s) =>
                  String(s)
                    .replace(/\\/g, "\\\\")
                    .replace(/\n/g, "\\n")
                    .replace(/[,;]/g, " ");
                const dt =
                  a.date.replaceAll("-", "") +
                  "T" +
                  a.time.replace(":", "") +
                  "00";
                download(
                  a.id + ".ics",
                  `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//SaludCerca//Solicitudes//ES\r\nBEGIN:VEVENT\r\nUID:${a.id}@saludcerca.local\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").split(".")[0]}Z\r\nDTSTART;TZID=America/Panama:${dt}\r\nDURATION:PT30M\r\nSUMMARY:${clean("Solicitud pendiente - " + a.doctorName)}\r\nDESCRIPTION:Recordatorio personal. Solicitud no enviada ni confirmada por el prestador.\r\nSTATUS:TENTATIVE\r\nEND:VEVENT\r\nEND:VCALENDAR`,
                  "text/calendar",
                );
              }
              break;
            case "scheduleLab":
              scheduleLaboratory(id);
              break;
            case "labDetail":
              if (o)
                openModal(
                  "Seguimiento de laboratorio",
                  `<h3>${escapeHtml(o.tests)}</h3><p>${statusBadge(o.status)}</p><p>Orden: ${escapeHtml(o.id)}</p><p>${o.scheduledDate ? formatDate(o.scheduledDate) + " · " + escapeHtml(o.scheduledTime) : "Sin fecha preferida"}</p><p>${escapeHtml(o.address || "")}</p><p class="small-label">Registro en este dispositivo. La coordinación externa no está conectada.</p>`,
                );
              break;
            case "acceptLabOrder":
              if (o && o.status === "Solicitud guardada") {
                o.status = "Aceptada por laboratorio";
                saveState(`Aceptación local ${o.id}`);
                render();
              }
              break;
            case "markSample":
              if (o && o.status === "Aceptada por laboratorio") {
                o.status = "Muestra tomada";
                saveState(`Registro local de toma ${o.id}`);
                render();
              }
              break;
            case "doctorOpenConsult":
              if (a && !["Cancelada", "Completada"].includes(a.status)) {
                selectedAppointment = id;
                setView("consultation");
              }
              break;
            case "reviewResult": {
              const r = state.labResults.find((r) => r.id === id);
              if (r)
                openModal(
                  "Revisión de resultado",
                  `<h3>${escapeHtml(r.testName)}</h3><form id="reviewForm" class="form-grid"><input type="hidden" name="id" value="${r.id}"><div class="form-group full"><label for="reviewText">Observación profesional</label><textarea id="reviewText" name="review" required></textarea></div><button class="btn btn-primary">Guardar revisión</button></form>`,
                );
              break;
            }
            case "downloadFakeResult":
              downloadResultFile(id);
              break;
            case "joinCall":
              openModal(
                "Preparar consulta virtual",
                `<div class="video-placeholder"><span class="service-symbol">${icon("video")}</span><h2>Sala de espera</h2><p>La conexión con un profesional aún no está habilitada.</p></div><video id="cameraPreview" class="camera-preview" autoplay muted playsinline hidden></video><p id="cameraStatus" class="small-label">Puedes comprobar tu cámara. No se transmitirá ni grabará imagen.</p><button class="btn btn-secondary" data-action="camera">Probar cámara</button>`,
              );
              break;
            case "camera":
              testCamera();
              break;
            case "revokeCaregiver":
              state.patient.caregiver.permissions = {
                appointments: false,
                results: false,
                prescriptions: false,
              };
              saveState("Preferencias familiares revocadas");
              render();
              toast("Preferencias revocadas.");
              break;
            case "cancelPharmacy": {
              const p = state.pharmacyOrders.find((p) => p.id === id);
              if (p) {
                openModal(
                  "Cancelar solicitud de farmacia",
                  `<p>¿Deseas cancelar ${escapeHtml(p.id)}?</p><button class="btn btn-primary" data-action="confirmPharmacyCancel" data-id="${p.id}">Sí, cancelar</button>`,
                );
              }
              break;
            }
            case "confirmPharmacyCancel": {
              const p = state.pharmacyOrders.find((p) => p.id === id);
              if (p) {
                p.status = "Cancelada";
                saveState();
                closeModal();
                render();
              }
              break;
            }
            case "attachment": {
              const p = state.pharmacyOrders.find((p) => p.id === id);
              if (
                p?.attachment &&
                /^data:(application\/pdf|image\/(png|jpeg));base64,/.test(
                  p.attachment.data,
                )
              ) {
                const a = document.createElement("a");
                a.href = p.attachment.data;
                a.download = p.attachment.name;
                a.click();
              }
              break;
            }
            case "toggleDoctor": {
              const d = state.doctors.find((d) => d.id === id);
              if (d) {
                d.available = !d.available;
                saveState("Disponibilidad del perfil actualizada");
                render();
              }
              break;
            }
            case "openPatientRecord":
              openModal(
                "Datos del paciente",
                `<h3>${escapeHtml(state.patient.name || "Sin nombre")}</h3><p>Alergias: ${escapeHtml(state.patient.allergies || "Sin registrar")}</p><p>Antecedentes: ${escapeHtml(state.patient.conditions || "Sin registrar")}</p>`,
              );
              break;
            case "exportData":
              download(
                "SaludCerca-respaldo.json",
                JSON.stringify(state, null, 2),
                "application/json",
              );
              break;
            case "reset":
              openModal(
                "Restablecer datos",
                `<p>Se eliminarán las solicitudes, adjuntos y preferencias guardadas en esta edición. Puedes exportar un respaldo antes de continuar.</p><div class="actions"><button class="btn btn-secondary" data-action="exportData">Exportar</button><button class="btn btn-primary" data-action="confirmReset">Eliminar y restablecer</button></div>`,
              );
              break;
            case "confirmReset":
              try {
                localStorage.removeItem(STORAGE_KEY);
              } catch {}
              state = structuredClone(defaultState);
              currentRole = "patient";
              currentView = "dashboard";
              closeModal();
              applyAccessibility();
              render();
              toast("Datos restablecidos.");
              break;
          }
        }

        function downloadResultFile(id) {
          const r = state.labResults.find((r) => r.id === id);
          if (!r) return;
          download(
            `${r.id}.txt`,
            [
              `${state.settings.appName} · Registro local`,
              r.id,
              r.testName,
              formatDate(r.date),
              ...r.values.map((v) => `${v.name}: ${v.value} (${v.range})`),
              `Laboratorio: ${r.labComment || ""}`,
              `Revisión: ${r.review || "Pendiente"}`,
              "Registro local sin validación ni firma clínica.",
            ].join("\n"),
            "text/plain",
          );
        }

        function initGlobalEvents() {
          document.addEventListener("click", (e) => {
            const el = e.target.closest("[data-view],[data-action]");
            if (!el) return;
            if (el.dataset.view) setView(el.dataset.view);
            else handleAction(el.dataset.action, el.dataset.id);
          });
          $("#menuBtn").addEventListener("click", () =>
            $("#sidebar").classList.toggle("open"),
          );
          $("#closeModalBtn").addEventListener("click", closeModal);
          $("#modalBackdrop").addEventListener("click", closeModal);
          $("#fontBtn").addEventListener("click", () => {
            state.accessibility.largeText = !state.accessibility.largeText;
            applyAccessibility();
            saveState();
          });
          $("#contrastBtn").addEventListener("click", () => {
            state.accessibility.highContrast =
              !state.accessibility.highContrast;
            applyAccessibility();
            saveState();
          });
          document.addEventListener("change", (e) => {
            if (e.target.id === "bookMode") {
              $("#addressGroup").hidden = e.target.value === "Videollamada";
              $("#bookAddress").required = e.target.value !== "Videollamada";
            }
          });
          document.addEventListener("submit", (e) => {
            const id = e.target.id;
            const f = Object.fromEntries(new FormData(e.target));
            if (id === "coordinationForm") {
              submitCoordination(e);
              return;
            }
            if (id === "bookingForm") {
              e.preventDefault();
              booking = { ...booking, ...f };
              if (validAppointment(booking)) bookingStep(2);
            }
            if (id === "confirmBooking") {
              e.preventDefault();
              commitBooking();
            }
            if (id === "zoneForm") {
              e.preventDefault();
              state.zone = f.zone;
              saveState();
              closeModal();
              render();
            }
            if (id === "reviewForm") {
              e.preventDefault();
              const r = state.labResults.find((r) => r.id === f.id);
              if (r) {
                r.review = f.review;
                r.status = "Revisado por médico";
                notify("Se guardó una revisión de resultado.");
                saveState("Revisión local de resultado");
                closeModal();
                render();
              }
            }
            if (id === "labBooking") {
              e.preventDefault();
              const o = state.labOrders.find((o) => o.id === f.orderId);
              if (!o) return;
              if (f.date <= localDate())
                return toast("Elige una fecha a partir de mañana.");
              Object.assign(o, {
                scheduledDate: f.date,
                scheduledTime: f.time,
                address: f.address,
                zone: f.zone,
                status: "Solicitud guardada",
                laboratory: "Por asignar",
              });
              notify("Solicitud de laboratorio guardada. Pendiente de envío.");
              saveState("Solicitud domiciliaria guardada");
              closeModal();
              render();
            }
          });
          document.addEventListener("keydown", (e) => {
            if ($("#modal").classList.contains("hidden")) return;
            if (e.key === "Escape") closeModal();
            if (e.key === "Tab") {
              const focus = [
                ...$("#modal").querySelectorAll(
                  "button,input,select,textarea,a[href]",
                ),
              ].filter((x) => !x.disabled && x.getClientRects().length);
              const first = focus[0],
                last = focus.at(-1);
              if (e.shiftKey && document.activeElement === first) {
                e.preventDefault();
                last?.focus();
              } else if (!e.shiftKey && document.activeElement === last) {
                e.preventDefault();
                first?.focus();
              }
            }
          });
          window.addEventListener("storage", (e) => {
            if (e.key === STORAGE_KEY && e.newValue) {
              state = loadState();
              if ($("#modal").classList.contains("hidden")) render();
              else
                toast(
                  "Hay cambios en otra pestaña. Revisa tu solicitud antes de guardar.",
                );
            }
          });
          window.addEventListener("pagehide", () =>
            cameraStream?.getTracks().forEach((t) => t.stop()),
          );
        }

        Object.assign(views.patient, {
          homeCare, pharmacy, notifications, network, careJourney, myServices,
          clinic:()=>serviceLanding('clinic'),
          hospital:()=>serviceLanding('hospital'),
          physiotherapy:()=>serviceLanding('physiotherapy'),
          rehabilitation:()=>serviceLanding('rehabilitation'),
          nursing:()=>serviceLanding('nursing'),
          transport:()=>serviceLanding('transport'),
          prevention:()=>serviceLanding('prevention'),
          ambulanceScheduled:()=>serviceLanding('ambulanceScheduled')
        });
        Object.assign(views.admin,{requestsAdmin});
        Object.assign(views.doctor, { results: patientResults, notifications });
        Object.assign(views.lab, { notifications });
        Object.assign(views.admin, { notifications });
        applyAccessibility();
        initGlobalEvents();
        render();
      })();
    </script>
  </body>
</html>
