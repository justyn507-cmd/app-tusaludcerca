<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="description"
      content="SaludCerca reúne opciones de atención privada, servicios de laboratorio, farmacia, bienestar y movilidad para organizar mejor tu salud."
    />
    <title>SaludCerca | Tu salud, tus opciones, todo más cerca</title>
    <style>
      :root {
        --primary: #0f766e;
        --primary-dark: #0b5e58;
        --secondary: #e6fffb;
        --accent: #2563eb;
        --bg: #f4f7f9;
        --surface: #ffffff;
        --text: #17202a;
        --muted: #64748b;
        --line: #dce5ea;
        --success: #15803d;
        --warning: #b45309;
        --danger: #b91c1c;
        --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        --radius: 18px;
        --font-scale: 1;
      }

      * {
        box-sizing: border-box;
      }

      html {
        font-size: calc(16px * var(--font-scale));
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background: var(--bg);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      select {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      a:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.35);
        outline-offset: 2px;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        min-height: 72px;
        padding: 10px 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background: rgba(255, 255, 255, 0.96);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 220px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: var(--primary);
        color: white;
        font-size: 1.45rem;
        box-shadow: var(--shadow);
      }

      .brand strong {
        display: block;
        font-size: 1.1rem;
      }
      .brand small {
        color: var(--muted);
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .chip,
      .icon-btn {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 12px;
      }

      .icon-btn {
        min-width: 42px;
      }

      .role-switch {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 10px;
        background: var(--secondary);
        border-radius: 14px;
      }

      .role-switch span {
        color: var(--primary-dark);
        font-size: 0.83rem;
        font-weight: 700;
      }

      .role-switch select {
        border: 1px solid #99d8d0;
        border-radius: 10px;
        padding: 8px 10px;
        background: white;
        color: var(--text);
      }

      .layout {
        display: grid;
        grid-template-columns: 270px 1fr;
        min-height: calc(100vh - 72px);
      }

      .sidebar {
        position: sticky;
        top: 72px;
        height: calc(100vh - 72px);
        overflow-y: auto;
        padding: 20px 16px;
        background: #0f2430;
        color: white;
      }

      .user-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px;
        margin-bottom: 18px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.08);
      }

      .avatar {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #ccfbf1;
        color: #0f766e;
        font-weight: 900;
      }

      .user-card strong,
      .user-card small {
        display: block;
      }
      .user-card small {
        color: #b8c8d1;
        margin-top: 2px;
      }

      #nav {
        display: grid;
        gap: 6px;
      }

      .nav-link {
        width: 100%;
        border: 0;
        text-align: left;
        padding: 12px 14px;
        border-radius: 12px;
        color: #dbe7ed;
        background: transparent;
        transition: 0.18s ease;
      }

      .nav-link:hover,
      .nav-link.active {
        color: white;
        background: rgba(255, 255, 255, 0.12);
        transform: translateX(2px);
      }

      .danger-soft {
        color: #fecaca;
      }
      .sidebar-footer {
        margin-top: 24px;
      }
      .sidebar-footer p {
        color: #8fa3af;
        font-size: 0.75rem;
        line-height: 1.45;
        padding: 0 8px;
      }

      .main {
        min-width: 0;
        padding: 28px;
      }

      .view {
        max-width: 1300px;
        margin: 0 auto;
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 18px;
        margin-bottom: 22px;
      }

      .page-header h1 {
        margin: 0 0 6px;
        font-size: clamp(1.55rem, 2.3vw, 2.25rem);
      }
      .page-header p {
        margin: 0;
        color: var(--muted);
        max-width: 760px;
        line-height: 1.55;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .btn {
        border: 0;
        border-radius: 12px;
        padding: 11px 16px;
        font-weight: 800;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
      }
      .btn-primary {
        background: var(--primary);
        color: white;
      }
      .btn-secondary {
        background: #e7eef5;
        color: #1e293b;
      }
      .btn-accent {
        background: var(--accent);
        color: white;
      }
      .btn-danger {
        background: var(--danger);
        color: white;
      }
      .btn-success {
        background: var(--success);
        color: white;
      }
      .btn-outline {
        background: white;
        color: var(--primary);
        border: 1px solid #99d8d0;
      }
      .btn-sm {
        padding: 8px 11px;
        font-size: 0.86rem;
      }

      .grid {
        display: grid;
        gap: 18px;
      }

      .grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .grid-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .grid-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px;
      }

      .card h2,
      .card h3 {
        margin-top: 0;
      }
      .card p {
        line-height: 1.55;
      }

      .stat {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .stat-icon {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: var(--secondary);
        font-size: 1.35rem;
      }

      .stat strong {
        display: block;
        font-size: 1.35rem;
      }
      .stat span {
        color: var(--muted);
        font-size: 0.86rem;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: 28px;
        background: linear-gradient(135deg, #0f766e, #155e75);
        color: white;
        border-radius: 24px;
        box-shadow: var(--shadow);
        margin-bottom: 20px;
      }

      .hero::after {
        content: "";
        position: absolute;
        right: -55px;
        top: -75px;
        width: 230px;
        height: 230px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
      }

      .hero h1 {
        margin: 0 0 10px;
        font-size: clamp(1.7rem, 3vw, 2.6rem);
      }
      .hero p {
        max-width: 760px;
        color: #e6fffb;
        line-height: 1.6;
      }
      .hero .actions {
        position: relative;
        z-index: 1;
        margin-top: 18px;
      }

      .alert {
        padding: 14px 16px;
        border-radius: 14px;
        margin: 14px 0;
        border-left: 5px solid;
      }

      .alert-info {
        background: #eff6ff;
        border-color: #2563eb;
        color: #1e3a8a;
      }
      .alert-warning {
        background: #fff7ed;
        border-color: #f59e0b;
        color: #7c2d12;
      }
      .alert-danger {
        background: #fef2f2;
        border-color: #dc2626;
        color: #7f1d1d;
      }
      .alert-success {
        background: #f0fdf4;
        border-color: #22c55e;
        color: #14532d;
      }

      .timeline {
        position: relative;
        display: grid;
        gap: 14px;
      }

      .timeline-item {
        display: grid;
        grid-template-columns: 38px 1fr;
        gap: 12px;
      }

      .timeline-dot {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--secondary);
        color: var(--primary);
        font-weight: 900;
      }

      .timeline-content {
        padding: 12px 14px;
        background: #f8fafc;
        border-radius: 14px;
        border: 1px solid var(--line);
      }

      .timeline-content strong {
        display: block;
        margin-bottom: 4px;
      }
      .timeline-content small {
        color: var(--muted);
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 680px;
      }

      th,
      td {
        text-align: left;
        padding: 13px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      th {
        color: #475569;
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        background: #f8fafc;
      }

      tbody tr:hover {
        background: #fbfdff;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 6px 9px;
        font-size: 0.77rem;
        font-weight: 800;
      }

      .badge-success {
        color: #166534;
        background: #dcfce7;
      }
      .badge-warning {
        color: #92400e;
        background: #fef3c7;
      }
      .badge-info {
        color: #1d4ed8;
        background: #dbeafe;
      }
      .badge-neutral {
        color: #475569;
        background: #e2e8f0;
      }
      .badge-danger {
        color: #991b1b;
        background: #fee2e2;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .form-group {
        display: grid;
        gap: 7px;
      }

      .form-group.full {
        grid-column: 1 / -1;
      }

      label {
        font-weight: 800;
        color: #334155;
        font-size: 0.9rem;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        padding: 11px 12px;
        background: white;
        color: var(--text);
      }

      textarea {
        min-height: 110px;
        resize: vertical;
      }

      .kpi {
        border-left: 5px solid var(--primary);
      }

      .kpi strong {
        display: block;
        font-size: 1.7rem;
        margin-top: 7px;
      }

      .kpi small {
        color: var(--muted);
      }

      .service-card {
        display: grid;
        gap: 10px;
        min-height: 210px;
      }

      .service-icon {
        font-size: 2rem;
      }
      .service-card p {
        color: var(--muted);
        margin: 0;
      }
      .service-card .btn {
        margin-top: auto;
        justify-self: start;
      }

      .doctor-card {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 14px;
        align-items: start;
      }

      .doctor-photo {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: #dbeafe;
        font-size: 1.4rem;
      }

      .doctor-meta {
        color: var(--muted);
        font-size: 0.86rem;
        margin: 4px 0 10px;
      }

      .progress {
        height: 9px;
        background: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
      }

      .progress > span {
        display: block;
        height: 100%;
        background: var(--primary);
        border-radius: inherit;
      }

      .result-row {
        display: grid;
        grid-template-columns: 1fr 120px 150px;
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid var(--line);
      }

      .result-row:last-child {
        border-bottom: 0;
      }
      .result-row strong {
        display: block;
      }
      .result-row small {
        color: var(--muted);
      }

      .video-shell {
        display: grid;
        grid-template-columns: 1fr 290px;
        gap: 16px;
      }

      .video-stage {
        min-height: 390px;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        border-radius: 20px;
        background:
          radial-gradient(
            circle at top left,
            rgba(255, 255, 255, 0.16),
            transparent 35%
          ),
          linear-gradient(145deg, #0f2430, #173f4d);
        color: white;
      }

      .video-person {
        text-align: center;
      }
      .video-person .big-avatar {
        width: 110px;
        height: 110px;
        display: grid;
        place-items: center;
        margin: 0 auto 12px;
        border-radius: 50%;
        background: #ccfbf1;
        color: #0f766e;
        font-size: 2rem;
        font-weight: 900;
      }

      .video-controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 20px;
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      .circle-btn {
        width: 46px;
        height: 46px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        color: white;
      }

      .circle-btn.end {
        background: #dc2626;
      }

      .chat-panel {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: white;
        display: flex;
        flex-direction: column;
        min-height: 390px;
      }

      .chat-messages {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
      }

      .message {
        width: fit-content;
        max-width: 88%;
        padding: 10px 12px;
        border-radius: 14px;
        margin-bottom: 10px;
        background: #e2e8f0;
      }

      .message.me {
        margin-left: auto;
        background: var(--secondary);
        color: var(--primary-dark);
      }

      .chat-input {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid var(--line);
      }

      .chat-input input {
        min-width: 0;
      }

      .empty {
        text-align: center;
        padding: 40px 20px;
        color: var(--muted);
      }

      .empty-icon {
        font-size: 2.6rem;
        margin-bottom: 10px;
      }

      .summary-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .summary-list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px dashed var(--line);
      }

      .summary-list li:last-child {
        border-bottom: 0;
      }
      .summary-list span {
        color: var(--muted);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 80;
        background: rgba(15, 23, 42, 0.58);
      }

      .modal {
        position: fixed;
        z-index: 90;
        width: min(780px, calc(100vw - 30px));
        max-height: calc(100vh - 40px);
        overflow: auto;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 20px;
        background: white;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.35);
      }

      .modal-header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 17px 20px;
        background: white;
        border-bottom: 1px solid var(--line);
      }

      .modal-header h2 {
        margin: 0;
      }
      .modal-body {
        padding: 20px;
      }

      .hidden {
        display: none !important;
      }

      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 110;
        max-width: 380px;
        padding: 13px 16px;
        border-radius: 13px;
        background: #0f2430;
        color: white;
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(15px);
        pointer-events: none;
        transition: 0.22s ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .mobile-only {
        display: none;
      }

      body.high-contrast {
        --bg: #000;
        --surface: #0a0a0a;
        --text: #fff;
        --muted: #d1d5db;
        --line: #535353;
        --secondary: #003f3a;
        --shadow: none;
      }

      body.high-contrast .topbar,
      body.high-contrast input,
      body.high-contrast select,
      body.high-contrast textarea,
      body.high-contrast .timeline-content,
      body.high-contrast .chat-panel,
      body.high-contrast .modal,
      body.high-contrast .modal-header {
        background: #0a0a0a;
        color: #fff;
      }

      body.high-contrast th {
        background: #111;
        color: #fff;
      }
      body.high-contrast tbody tr:hover {
        background: #111;
      }
      body.high-contrast .btn-secondary {
        background: #333;
        color: #fff;
      }

      @media (max-width: 1050px) {
        .grid-4 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .grid-3 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .video-shell {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 820px) {
        .mobile-only {
          display: inline-grid;
          place-items: center;
        }
        .topbar {
          padding: 10px 14px;
        }
        .brand small,
        .role-switch span {
          display: none;
        }
        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: fixed;
          z-index: 70;
          top: 72px;
          left: 0;
          width: 275px;
          transform: translateX(-102%);
          transition: transform 0.22s ease;
        }

        .sidebar.open {
          transform: translateX(0);
        }
        .main {
          padding: 20px 14px;
        }
      }

      @media (max-width: 620px) {
        .brand {
          min-width: 0;
        }
        .brand strong {
          font-size: 0.96rem;
        }
        .top-actions {
          gap: 6px;
        }
        .role-switch {
          padding: 5px;
        }
        .role-switch select {
          max-width: 125px;
        }
        .chip {
          display: none;
        }

        .grid-4,
        .grid-3,
        .grid-2,
        .form-grid {
          grid-template-columns: 1fr;
        }
        .form-group.full {
          grid-column: auto;
        }
        .page-header {
          display: grid;
        }
        .hero {
          padding: 22px;
        }
        .result-row {
          grid-template-columns: 1fr;
        }
      }

      /* SaludCerca 2 · Visual system · No external font or image dependencies */
      :root {
        --primary: #087d74;
        --primary-dark: #075e58;
        --accent: #d5f08a;
        --text: #1b3034;
        --muted: #697b7d;
        --border: #e1e9e7;
        --bg: #f5f8f7;
        --radius: 20px;
        --shadow: 0 8px 28px #123e3506;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        letter-spacing: -0.015em;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #c09a25;
        outline-offset: 3px;
      }
      h1,
      h2,
      h3 {
        letter-spacing: -0.04em;
      }
      h1 {
        font-size: 32px;
      }
      h2 {
        font-size: 21px;
      }
      p {
        line-height: 1.65;
      }
      small {
        line-height: 1.5;
      }
      a {
        color: var(--primary);
      }
      .topbar {
        height: 84px;
        background: #fff;
        border-bottom: 1px solid var(--border);
        padding: 0 36px;
        box-shadow: none;
      }
      .brand-mark {
        background: var(--primary);
        border-radius: 14px;
        box-shadow: none;
        font-size: 26px;
      }
      .brand strong {
        font-size: 23px;
        letter-spacing: -0.8px;
      }
      .brand small {
        font-size: 11px;
        letter-spacing: 0.04em;
      }
      .top-actions {

        margin: 0;

        font-size: 12px;

        color: #214c3a;
        white-space: nowrap;
      }
      .small-label {

        margin-right: 5px;

        display: grid;
        gap: 14px;
      }

        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 12px;
      }
      .record-head h2 {
        margin: 0 0 6px;

      }
      .record-head p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

        height: 18px;
      }
      .bottomnav {
        display: none;
      }
      .toast {
        background: #163e34;
        border-radius: 12px;
      }
      .sync-label {
        font-size: 10px;
        color: #83938b;
      }
      .portal-title {
        font-size: 12px;
        margin: 25px 12px 8px;
        color: var(--muted);
      }

        gap: 18px;
        justify-content: center;
        margin: 28px 0 5px;
        flex-wrap: wrap;

      .high-contrast {
        --text: #071b16;
        --muted: #344f43;
        --border: #749786;
        --bg: #fff;

      .high-contrast .small-label,
      .high-contrast .sync-label {
        color: #344f43;
      }
      .high-contrast .hero-new {
        background: #e1efdf;
      }
      .bigtext {
        font-size: 115%;
      }
      .camera-preview {

      .file-name {

      }
      .summary-list strong {

      .mobile-only {
        display: none;

          font-size: 48px;

          padding: 25px;

        }

        }

          gap: 10px;

        }

          padding: 9px;
        }

          width: 15px;

          padding: 5px 9px;

          color: #067d64;

          grid-template-columns: 1fr;

          grid-column: auto;
        }
        .page-header h1 {
          font-size: 28px;
        }
        .record-head {
          flex-wrap: wrap;
        }
        .grid-4,

          grid-template-columns: 1fr;

          gap: 8px;

        .modal-body {
          padding: 18px;
        }
        .modal-header {
          padding: 18px;
        }
        .hero-new p {
          font-size: 13px;
        }
        .top-actions .chip {
          padding: 7px;
        }
        .steps {
          gap: 8px;
        }
        .page-header .actions {
          margin-top: 12px;
        }
        .service-tile .service-symbol {
          padding: 9px;
        }

      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
          animation: none !important;
        }
      }

        color: var(--muted);

        max-width: 20px;
      }

      }

        background: #e1efdf;

      }

        background: #fff;

          display: flex;
        }

          font-size: 20px;
        }

        }
      }

  <body>
    <noscript>Para utilizar SaludCerca, activa JavaScript en tu navegador.</noscript>

    <div id="app">
      <header class="topbar">

        <div class="top-actions">
          <button class="chip" id="fontBtn" title="Aumentar tamaño de letra">

    <script>
      (() => {
        "use strict";

        const STORAGE_KEY = "saludCercaV4";
        const $ = (selector) => document.querySelector(selector);
        const $$ = (selector) =>
          Array.from(document.querySelectorAll(selector));

        const defaultState = {

        };

        };
        const navConfig = {

            ["dashboard", "Inicio"],

            ["rehabilitation", "Rehabilitación"],
            ["nursing", "Enfermería"],
            ["transport", "Transporte asistido"],

            ["prescriptions", "Indicaciones"],

          doctor: [

            ["schedule", "Agenda"],
            ["patients", "Pacientes"],
            ["orders", "Órdenes"],

          ],
          lab: [
            ["dashboard", "Inicio"],

            ["uploadResults", "Resultados"],
          ],
          admin: [
            ["dashboard", "Inicio"],

            ["requestsAdmin", "Gestiones integrales"],
            ["manageServices", "Servicios"],
            ["reports", "Reportes"],
            ["audit", "Actividad"],
          ],
        };


        // Catálogo por categoría de servicio.
        const integralServices = {
          clinic: {title:"Clínicas privadas",icon:"home",view:"clinic",summary:"Consultas y servicios ambulatorios de clínicas participantes.",detail:"Búsqueda y coordinación de citas según agenda del establecimiento. La confirmación requiere un acuerdo e integración real.",sample:"Clínica privada participante",phase:"Desarrollo de red"},
          hospital: {title:"Hospitales privados",icon:"home",view:"hospital",summary:"Orientación hacia servicios hospitalarios privados programados.",detail:"Solicitud de información para consultas o procedimientos electivos. No incluye triaje, camas ni urgencias hospitalarias.",sample:"Hospital privado participante",phase:"Desarrollo de red"},
          physiotherapy: {title:"Fisioterapia",icon:"heart",view:"physiotherapy",summary:"Sesiones presenciales o domiciliarias con profesionales autorizados.",detail:"Evaluación inicial y sesiones programadas de fisioterapia, según indicación y criterio del profesional.",sample:"Centro o profesional de fisioterapia",phase:"Expansión progresiva"},
          rehabilitation: {title:"Rehabilitación",icon:"heart",view:"rehabilitation",summary:"Coordinación de recuperación y programas de rehabilitación.",detail:"Interés en rehabilitación funcional mediante instituciones y equipos competentes; cada plan clínico debe definirse presencialmente o en consulta adecuada.",sample:"Centro de rehabilitación privado",phase:"Expansión progresiva"},
          nursing: {title:"Enfermería domiciliaria",icon:"home",view:"nursing",summary:"Atención de enfermería programada dentro de competencias profesionales.",detail:"Gestión de interés en servicios de enfermería con proveedores acreditados y cobertura confirmada.",sample:"Equipo autorizado de enfermería",phase:"Expansión progresiva"},
          transport: {title:"Transporte asistido",icon:"pin",view:"transport",summary:"Traslados no urgentes para personas que requieren apoyo al movilizarse.",detail:"Traslados programados sin respuesta de emergencia; el tipo de vehículo y acompañamiento se confirmarían por el operador.",sample:"Operador de transporte asistido",phase:"Expansión progresiva"},
          ambulanceScheduled: {title:"Ambulancia programada",icon:"phone",view:"ambulanceScheduled",summary:"Traslados clínicos coordinados no urgentes, cuando corresponda.",detail:"Traslado en ambulancia con indicación o evaluación pertinente, según equipamiento, personal y proveedor habilitado. No despacha ambulancias de emergencia.",sample:"Operador habilitado de ambulancias",phase:"Plan futuro"},
          prevention: {title:"Programas preventivos",icon:"shield",view:"prevention",summary:"Chequeos, orientación y programas de prevención con aliados.",detail:"Interés en evaluaciones preventivas y seguimiento según edad, antecedentes y criterio profesional, sin diagnósticos automatizados.",sample:"Clínica o programa de prevención",phase:"Expansión progresiva"}
        };
        const partnerDirectory = [
          {id:"med",name:"Médicos privados",icon:"heart",desc:"Especialidades, consultas presenciales o virtuales",view:"newAppointment",phase:"Consultas"},
          {id:"clinic",name:"Clínicas privadas",icon:"home",desc:"Consulta y atención ambulatoria programada",view:"clinic",phase:"Red por validar"},
          {id:"hospital",name:"Hospitales privados",icon:"home",desc:"Servicios electivos y consultas externas",view:"hospital",phase:"Red por validar"},
          {id:"lab",name:"Laboratorios clínicos",icon:"lab",desc:"Órdenes y coordinación de tomas de muestras",view:"lab",phase:"Laboratorio"},
          {id:"pharmacy",name:"Farmacias participantes",icon:"pill",desc:"Medicamentos, recetas y opciones de entrega",view:"pharmacy",phase:"Farmacias"},
          ...Object.entries(integralServices).filter(([key])=>!['clinic','hospital'].includes(key)).map(([key,s])=>({id:key,name:s.title,icon:s.icon,desc:s.summary,view:s.view,phase:s.phase}))
        ];
        let catalogSearch="";

        function loadState() {
          try {
            const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
            if (!raw || raw.version !== 2) return structuredClone(defaultState);
            const merged = { ...structuredClone(defaultState), ...raw };
            for (const key of [
              "appointments",
              "labOrders",
              "labResults",
              "prescriptions",
              "notifications",
              "audit",
              "pharmacyOrders",
              "coordinationRequests",
              "notes",
            ]) {
              if (!Array.isArray(merged[key])) merged[key] = [];
            }
            merged.patient = {
              ...defaultState.patient,
              ...raw.patient,
              caregiver: {
                ...defaultState.patient.caregiver,
                ...raw.patient?.caregiver,
              },
            };
            merged.settings = { ...defaultState.settings, ...raw.settings };
            return merged;
          } catch {
            return structuredClone(defaultState);
          }
        }

        function saveState(action = "") {
          state.currentRole = currentRole;
          state.currentView = currentView;
          if (action)
            state.audit.unshift({
              time: new Date().toISOString(),
              action,
              role: currentRole,
            });
          state.audit = state.audit.slice(0, 200);
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          } catch {
            toast(
              "No se pudo guardar. El almacenamiento del navegador está lleno o bloqueado.",
            );
            return false;
          }
          return true;
        }

        function formatDate(dateString) {
          if (!dateString) return "Sin fecha";
          const date = new Date(`${dateString}T12:00:00`);
          return new Intl.DateTimeFormat("es-PA", {
            day: "numeric",
            month: "long",
            year: "numeric",
          }).format(date);
        }

        function money(value) {
          return new Intl.NumberFormat("es-PA", {
            style: "currency",
            currency: "USD",
          }).format(value || 0);
        }

        function statusBadge(status) {
          const s = String(status || "").toLowerCase();
          let cls = "badge-neutral";
          if (s.includes("pend")) cls = "badge-warning";
          else if (
            s.includes("confirm") ||
            s.includes("revis") ||
            s.includes("complet") ||
            s.includes("cargado")
          )
            cls = "badge-success";
          else if (
            s.includes("pend") ||
            s.includes("creada") ||
            s.includes("program")
          )
            cls = "badge-warning";
          else if (s.includes("cancel")) cls = "badge-danger";
          else if (s.includes("proceso") || s.includes("acept"))
            cls = "badge-info";
          return `<span class="badge ${cls}">${escapeHtml(status)}</span>`;
        }

        function escapeHtml(value) {
          return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        function toast(message) {
          const el = $("#toast");
          el.textContent = message;
          el.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
        }

        function openModal(title, html) {
          focusBeforeModal = document.activeElement;
          $("#modalTitle").textContent = title;
          $("#modalBody").innerHTML = html;
          $("#modalBackdrop").classList.remove("hidden");
          $("#modal").classList.remove("hidden");
          $("#app").inert = true;
          document.body.style.overflow = "hidden";
          $("#closeModalBtn").focus();
        }

        function closeModal() {
          if (cameraStream) {
            cameraStream.getTracks().forEach((t) => t.stop());
            cameraStream = null;
          }
          $("#modalBackdrop").classList.add("hidden");
          $("#modal").classList.add("hidden");
          $("#modalBody").innerHTML = "";
          $("#app").inert = false;
          document.body.style.overflow = "";
          if (focusBeforeModal?.isConnected) focusBeforeModal.focus();
        }

        function applyAccessibility() {
          document.documentElement.style.setProperty(
            "--font-scale",
            state.accessibility.largeText ? "1.14" : "1",
          );
          document.body.classList.toggle(
            "high-contrast",
            !!state.accessibility.highContrast,
          );
        }

        function setRole(role) {
          if (!roleData[role]) return;
          currentRole = role;
          currentView = "dashboard";
          closeModal();
          saveState();
          render();
        }

        function setView(view) {
          if (!views[currentRole]?.[view]) return;
          currentView = view;
          saveState();
          render();
          $("#sidebar").classList.remove("open");
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function renderShell() {
          if (!roleData[currentRole]) currentRole = "patient";
          const info = roleData[currentRole];
          $("#roleName").textContent = info.name();
          $("#roleSubtitle").textContent = info.subtitle;
          $("#avatar").textContent =
            currentRole === "patient"
              ? initials(state.patient.name || "Mi cuenta")
              : initials(info.name());
          $("#brandName").textContent = state.settings.appName;
          $("#nav").innerHTML = navConfig[currentRole]
            .map(
              ([v, label]) =>
                `<button class="nav-link ${v === currentView ? "active" : ""}" data-view="${v}" ${v === currentView ? 'aria-current="page"' : ""}>${icon(navIcons[v] || "file")}${label}</button>`,
            )
            .join("");
          $("#bottomnav").innerHTML = (
            currentRole === "patient"
              ? [
                  ["dashboard", "Inicio", "home"],
                  ["network", "Explorar", "search"],
                  ["careJourney", "Mi atención", "heart"],
                  ["profile", "Cuenta", "user"],
                ]
              : [
                  ["dashboard", "Inicio", "home"],
                  ["workspace", "Cambiar espacio", "users"],
                ]
          )
            .map(
              ([v, l, i]) =>
                `<button class="${v === currentView ? "active" : ""}" ${v === "workspace" ? 'data-action="workspace"' : `data-view="${v}"`}>${icon(i)}${l}</button>`,
            )
            .join("");
          $("#notifyBtn").innerHTML =
            icon("bell") +
            (state.notifications.some((n) => !n.read)
              ? '<span class="notice-dot"></span>'
              : "");
        }

        function render() {
          renderShell();
          const renderer =
            views[currentRole]?.[currentView] || views[currentRole].dashboard;
          $("#view").innerHTML = renderer();
          bindViewEvents();
        }

        function pageHeader(title, description, actions = "") {
          return `
      <div class="page-header">
        <div>
          <h1>${title}</h1>
          <p>${description}</p>
        </div>
        ${actions ? `<div class="actions">${actions}</div>` : ""}
      </div>
    `;
        }

        function dashboardPatient() {
          const next = state.appointments
            .filter(
              (a) =>
                !["Cancelada", "Completada"].includes(a.status) &&
                a.date >= localDate(),
            )
            .sort((a, b) =>
              (a.date + a.time).localeCompare(b.date + b.time),
            )[0];
          const name = state.patient.name.trim().split(" ")[0];
          const svc = [
            ["heart", "Médicos", "Consulta privada", "newAppointment"],
            ["home", "Clínicas y hospitales", "Red privada", "network"],
            ["lab", "Laboratorio", "Pruebas y resultados", "lab"],
            ["pill", "Farmacias", "Medicamentos y entrega", "pharmacy"],
            ["heart", "Fisioterapia", "Sesiones y recuperación", "physiotherapy"],
            ["heart", "Rehabilitación", "Programas de cuidado", "rehabilitation"],
            ["pin", "Transporte asistido", "Traslados programados", "transport"],
            ["shield", "Prevención", "Chequeos y programas", "prevention"],
          ];
          return `<div class="home-intro"><div><h1>${name ? "Hola, " + escapeHtml(name) : "Bienvenido a SaludCerca"}</h1><p>Tus servicios de salud, en un solo lugar.</p></div><button class="location" data-action="coverage">${icon("pin")}${escapeHtml(state.zone || "Santiago, Veraguas")}</button></div>

        function patientAppointments() {
          const all = state.appointments
            .filter((a) => a.patientId === state.patient.id)
            .sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
          const rows = all.filter(
            (a) =>
              appointmentFilter === "all" ||
              (appointmentFilter === "active"
                ? !["Cancelada", "Completada"].includes(a.status)
                : ["Cancelada", "Completada"].includes(a.status)),
          );
          return `${pageHeader("Mis citas", "Consulta tus solicitudes y organiza tu próxima atención.", `<button class="btn btn-primary" data-view="newAppointment">Nueva solicitud</button>`)}<div class="pill-tabs">${[
            ["all", "Todas"],
            ["active", "Pendientes"],
            ["history", "Historial"],
          ]
            .map(
              ([v, l]) =>
                `<button class="${appointmentFilter === v ? "active" : ""}" data-action="filterAppointments" data-id="${v}">${l}</button>`,
            )
            .join(
              "",
            )}</div><div class="record-list">${rows.map((a) => `<article class="card"><div class="record-head"><div><h2>${escapeHtml(a.doctorName)}</h2><p>${escapeHtml(a.specialty)} · ${escapeHtml(a.mode)}</p></div>${statusBadge(a.status)}</div><p>${icon("calendar")} ${formatDate(a.date)} · ${escapeHtml(a.time)} <span class="small-label">${escapeHtml(a.id)}</span></p><div class="actions"><button class="btn btn-secondary btn-sm" data-action="appointmentDetail" data-id="${a.id}">Ver detalles</button>${!["Cancelada", "Completada"].includes(a.status) ? `<button class="btn btn-secondary btn-sm" data-action="reschedule" data-id="${a.id}">Reprogramar</button><button class="text-btn" data-action="cancelAppointment" data-id="${a.id}">Cancelar</button>` : ""}${a.mode === "Videollamada" && a.status === "Confirmada" ? `<button class="btn btn-primary btn-sm" data-action="joinCall" data-id="${a.id}">Sala de espera</button>` : ""}</div></article>`).join("") || emptyState("calendar", "Tu agenda comienza aquí", "Busca un profesional y guarda tu primera solicitud.", "newAppointment", "Buscar atención")}</div>`;
        }

        function newAppointment() {
          return `${pageHeader("Encuentra tu atención", "Elige un profesional y organiza la modalidad que mejor se adapte a ti.")}

          return `${pageHeader("Laboratorio a domicilio", "Coordina una toma de muestras a partir de tu orden médica.")}<div class="record-list">${orders.map((o) => `<article class="card"><div class="record-head"><div><h2>${escapeHtml(o.tests)}</h2><p>${escapeHtml(o.doctorName)} · ${escapeHtml(o.id)}</p></div>${statusBadge(o.status)}</div><p>${escapeHtml(o.reason)}</p>${o.scheduledDate ? `<p>${icon("calendar")} ${formatDate(o.scheduledDate)} · ${escapeHtml(o.scheduledTime)}</p><p>${icon("pin")} ${escapeHtml(o.address)}</p>` : ""}<div class="actions">${!o.scheduledDate ? `<button class="btn btn-primary" data-action="scheduleLab" data-id="${o.id}">Solicitar toma en casa</button>` : ""}<button class="text-btn" data-action="labDetail" data-id="${o.id}">Ver seguimiento ${icon("arrow")}</button></div></article>`).join("") || emptyState("lab", "Tus órdenes aparecerán aquí", "Después de una consulta, el profesional puede registrar una orden de laboratorio.", "newAppointment", "Solicitar consulta")}</div><p class="small-label">La preparación y posibilidad de toma domiciliaria deben confirmarse con el laboratorio.</p>`;

        }

        function patientPrescriptions() {
          return `${pageHeader("Indicaciones y seguimiento", "Consulta las notas asociadas a tu atención.")}<div class="record-list">${state.prescriptions.map((r) => `<article class="card"><div class="record-head"><div><h2>${escapeHtml(r.medication)}</h2><p>${escapeHtml(r.doctorName)} · ${formatDate(r.date)}</p></div>${statusBadge("Borrador")}</div><p>${escapeHtml(r.instructions)}</p><span class="small-label">Registro local sin firma clínica.</span></article>`).join("") || emptyState("file", "Tus indicaciones en un lugar", "Aquí aparecerán las notas registradas en tu atención.")}</div>`;
        }

              ([k, l]) =>
                `<label><input type="checkbox" name="${k}" ${c.permissions?.[k] ? "checked" : ""}>${l}</label>`,

            .join(
              "",
            )}</div><div class="form-group full"><button class="btn btn-primary">Guardar preferencias</button></div></form><article class="card"><span class="service-symbol">${icon("users")}</span><h2>El cuidado se comparte</h2><p>Define las gestiones en las que deseas recibir ayuda. Puedes cambiar tus preferencias cuando lo necesites.</p><p class="small-label">Guardar estas preferencias no envía una invitación ni crea acceso remoto para otra persona. La verificación de identidad y permisos estará disponible al conectar el servicio.</p><button class="btn btn-secondary" data-action="revokeCaregiver">Revocar preferencias de acceso</button></article></div>`;

            <div class="grid grid-2"><article class="card priority-card"><span class="service-symbol">${icon("phone")}</span><h2>Emergencia médica real</h2><p>Si hay peligro inmediato para la vida, llama al SUME 9-1-1 en Panamá. SaludCerca no realiza triaje ni despacha ambulancias.</p><a class="call-911" href="tel:911">Llamar al 9-1-1 ahora</a><p class="small-label">Ante una emergencia, utiliza los canales oficiales de respuesta inmediata.</p></article>

          <tbody>${rows}</tbody>

          return `
      ${pageHeader("Notas y recetas", "Borradores para documentar el seguimiento. Requieren validación profesional.")}
      <div class="grid grid-2">
        <article class="card">
          <h2>Última indicación</h2>

            <div class="form-group full"><button class="btn btn-primary">Guardar</button></div>
          </form>

        function labDashboard() {
          return `${pageHeader("Espacio de laboratorio", "Organiza visitas y resultados asociados a cada orden.")}<div class="grid grid-3"><article class="card kpi"><small>Órdenes</small><strong>${state.labOrders.length}</strong></article><article class="card kpi"><small>Visitas solicitadas</small><strong>${state.labOrders.filter((o) => o.scheduledDate).length}</strong></article><article class="card kpi"><small>Resultados registrados</small><strong>${state.labResults.length}</strong></article></div><div class="section-title"><h2>Solicitudes</h2><button class="text-btn" data-view="uploadResults">Registrar resultado ${icon("arrow")}</button></div>${labQueue()}`;

        function localDate(offset = 0) {

        function uid(prefix) {
          return (
            prefix +
            "-" +

        function initials(name) {

            (d) =>

                  `<article class="card"><div class="provider-head"><div class="provider-avatar">${initials(d.name.replace(/^Dra?\.?\s*/, ""))}</div><div><h2>${escapeHtml(d.name)}</h2><p>${escapeHtml(d.specialty)}</p></div></div><div class="provider-line">${icon("pin")}Santiago · Veraguas</div><div class="provider-line">${icon(d.mode.includes("domicilio") ? "home" : "video")}${escapeHtml(d.mode)}</div><button class="text-btn" data-action="doctorInfo" data-id="${d.id}">Ver perfil ${icon("arrow")}</button><div class="provider-bottom"><div class="price"><small>Valor de referencia</small><strong>${money(d.price)}</strong></div><button class="btn btn-primary btn-sm" data-action="book" data-id="${d.id}">Elegir</button></div></article>`,

        function fold(s) {

            .replace(/[\u0300-\u036f]/g, "")

        function homeCare() {

        }

        function bookDoctor(id, existingId = "") {
          const doctor = state.doctors.find((d) => d.id === id && d.available);
          if (!doctor)
            return toast("Este perfil no admite nuevas solicitudes.");
          const old = state.appointments.find((a) => a.id === existingId);
          booking = {
            doctorId: id,
            existingId,
            date: old?.date || localDate(1),
            time: old?.time || "09:00",
            mode:
              old?.mode ||
              (modeFilter === "domicilio" && doctor.mode.includes("domicilio")
                ? "Visita médica a domicilio"
                : "Videollamada"),
            address: old?.address || state.patient.address,
            symptoms: old?.symptoms || "",
            name: state.patient.name,
            phone: state.patient.phone,
          };
          bookingStep(1);
        }

        function bookingStep(step) {
          const d = state.doctors.find((d) => d.id === booking.doctorId);

            booking.mode === "Videollamada"

              : Number(state.settings.homeVisitPrice);

            booking.existingId ? "Reprogramar solicitud" : "Solicitar atención",
            `<div class="wizard-steps"><span class="on">1 · Fecha y datos</span><span class="${step === 2 ? "on" : ""}">2 · Revisar solicitud</span></div>
    ${
      step === 1
        ? `<div class="provider-head"><div class="provider-avatar">${icon("user")}</div><div><h2>${escapeHtml(d.name)}</h2><p>${escapeHtml(d.specialty)}</p></div></div><form id="bookingForm" class="form-grid"><div class="form-group full"><label for="bookMode">Modalidad</label><select id="bookMode" name="mode"><option ${booking.mode === "Videollamada" ? "selected" : ""}>Videollamada</option>${d.mode.includes("domicilio") ? `<option ${booking.mode !== "Videollamada" ? "selected" : ""}>Visita médica a domicilio</option>` : ""}</select></div><div class="form-group"><label for="bookDate">Fecha preferida</label><input id="bookDate" type="date" name="date" min="${localDate()}" value="${booking.date}" required></div><div class="form-group"><label for="bookTime">Hora preferida</label><select id="bookTime" name="time">${["08:00", "09:00", "10:00", "11:30", "14:00", "15:30", "17:00"].map((t) => `<option ${booking.time === t ? "selected" : ""}>${t}</option>`).join("")}</select></div><div class="form-group"><label for="bookName">Nombre del paciente</label><input id="bookName" name="name" value="${escapeHtml(booking.name)}" required maxlength="100"></div><div class="form-group"><label for="bookPhone">Teléfono de contacto</label><input id="bookPhone" name="phone" type="tel" value="${escapeHtml(booking.phone)}" minlength="7" maxlength="20" required></div><div class="form-group full" id="addressGroup" ${booking.mode === "Videollamada" ? "hidden" : ""}><label for="bookAddress">Dirección para la visita</label><input id="bookAddress" name="address" value="${escapeHtml(booking.address)}" ${booking.mode !== "Videollamada" ? "required" : ""}></div><div class="form-group full"><label for="bookReason">Motivo de consulta</label><textarea id="bookReason" name="symptoms" required maxlength="1200" placeholder="Describe brevemente lo que necesitas">${escapeHtml(booking.symptoms)}</textarea></div><div class="form-group full"><button class="btn btn-primary" type="submit">Continuar ${icon("arrow")}</button></div></form>`
        : `<div class="review-line"><span>Profesional</span><strong>${escapeHtml(d.name)}</strong></div><div class="review-line"><span>Modalidad</span><strong>${escapeHtml(booking.mode)}</strong></div><div class="review-line"><span>Fecha preferida</span><strong>${formatDate(booking.date)} · ${booking.time}</strong></div><div class="review-line"><span>Paciente</span><strong>${escapeHtml(booking.name)}</strong></div>${booking.mode !== "Videollamada" ? `<div class="review-line"><span>Dirección</span><strong>${escapeHtml(booking.address)}</strong></div>` : ""}<div class="review-line"><span>Tarifa de referencia</span><strong>${money(total)}</strong></div><p class="small-label">No se realizará un cobro. El horario y precio final requieren confirmación del prestador.</p><div class="alert alert-info">La solicitud se guardará en este dispositivo. El envío a un prestador todavía no está habilitado.</div><form id="confirmBooking"><label class="checks"><span><input type="checkbox" required> He revisado los datos de la solicitud.</span></label><div class="actions" style="margin-top:20px"><button type="button" class="btn btn-secondary" data-action="bookingBack">Volver</button><button class="btn btn-primary" type="submit">Guardar solicitud</button></div></form>`
    }`,
          );
        }

        function commitBooking() {
          const doctor = state.doctors.find(
            (d) => d.id === booking.doctorId && d.available,
          );
          if (!doctor) return toast("El profesional ya no está disponible.");
          if (!validAppointment(booking)) return;
          const a = {
            id: booking.existingId || uid("C"),
            patientId: state.patient.id,
            patientName: booking.name,
            doctorId: doctor.id,
            doctorName: doctor.name,
            specialty: doctor.specialty,
            date: booking.date,
            time: booking.time,
            mode: booking.mode,
            address: booking.address,
            symptoms: booking.symptoms,
            price:
              booking.mode === "Videollamada"
                ? doctor.price
                : Number(state.settings.homeVisitPrice),
            status: "Pendiente de envío",
            createdAt: new Date().toISOString(),
          };
          const i = state.appointments.findIndex((x) => x.id === a.id);
          if (i >= 0) state.appointments[i] = a;
          else state.appointments.push(a);
          state.patient.name = booking.name;
          state.patient.phone = booking.phone;
          if (booking.mode !== "Videollamada")
            state.patient.address = booking.address;
          notify(
            `Solicitud ${a.id} guardada para ${formatDate(a.date)}. Pendiente de envío.`,
          );
          if (!saveState(`Solicitud ${a.id} guardada`)) return;
          closeModal();
          setView("appointments");
          toast("Solicitud guardada en este dispositivo.");
        }

        function validAppointment(b) {
          if (new Date(b.date + "T" + b.time) <= new Date()) {
            toast("Elige una fecha y hora futuras.");
            return false;
          }
          if (
            state.appointments.some(
              (a) =>
                a.id !== b.existingId &&
                a.doctorId === b.doctorId &&
                a.date === b.date &&
                a.time === b.time &&
                !["Cancelada", "Completada"].includes(a.status),
            )
          ) {
            toast("Ya tienes una solicitud en ese horario. Elige otro.");
            return false;
          }
          return true;
        }

        function emptyState(i, t, p, v = "", label = "Continuar") {
          return `<article class="card empty"><span class="service-symbol">${icon(i)}</span><h2>${t}</h2><p>${p}</p>${v ? `<button class="btn btn-primary" data-view="${v}">${label}</button>` : ""}</article>`;
        }

        function scheduleLaboratory(id) {
          const o = state.labOrders.find((o) => o.id === id);
          if (!o || o.scheduledDate) return;
          openModal(
            "Solicitar toma de muestras",
            `<p><strong>${escapeHtml(o.tests)}</strong></p><form id="labBooking" class="form-grid"><input type="hidden" name="orderId" value="${o.id}"><div class="form-group"><label for="labDate">Fecha preferida</label><input id="labDate" name="date" type="date" min="${localDate(1)}" required></div><div class="form-group"><label for="labTime">Franja preferida</label><select id="labTime" name="time"><option>07:00</option><option>08:30</option><option>10:00</option></select></div><div class="form-group full"><label for="labAddress">Dirección</label><input id="labAddress" name="address" value="${escapeHtml(state.patient.address)}" required></div><div class="form-group full"><label for="labZone">Zona</label><select id="labZone" name="zone"><option>Santiago</option><option>Atalaya</option><option>Otra zona</option></select></div><div class="form-group full"><p class="small-label">Precio y cobertura pendientes de cotización. La solicitud se conserva en este dispositivo; aún no se envía a un laboratorio.</p><button class="btn btn-primary">Guardar solicitud</button></div></form>`,
          );
        }

        function pharmacy() {
          if (!state.settings.pharmacyEnabled)
            return emptyState(
              "pill",
              "Servicio no habilitado",

          const url = URL.createObjectURL(

          a.href = url;
          a.download = name;

        function submitPharmacy(e) {
          e.preventDefault();
          const form = e.target;
          const f = new FormData(form);
          const file = f.get("attachment");
          if (file?.size > 1024 * 1024)
            return toast("El adjunto debe pesar menos de 1 MB.");
          if (
            file?.size &&
            !["application/pdf", "image/jpeg", "image/png"].includes(file.type)
          )
            return toast("Adjunta un PDF, JPG o PNG.");
          const button = form.querySelector("button[type=submit]");
          button.disabled = true;
          const commit = (attachment) => {
            state.pharmacyOrders.unshift({
              id: uid("FAR"),
              items: f.get("items"),
              address: f.get("address"),
              phone: f.get("phone"),
              deliveryMode: f.get("deliveryMode") || "Por coordinar",
              attachment,
              status: "Pendiente de envío",
              createdAt: new Date().toISOString(),
            });
            notify("Solicitud de farmacia guardada. Pendiente de envío.");
            if (saveState("Solicitud de farmacia guardada")) {
              render();
              toast("Solicitud guardada en este dispositivo.");
            } else {
              state.pharmacyOrders.shift();
              button.disabled = false;
            }
          };
          if (file?.size) {
            const reader = new FileReader();
            reader.onload = () =>
              commit({ name: file.name, type: file.type, data: reader.result });
            reader.onerror = () => {
              button.disabled = false;
              toast("No se pudo leer el archivo.");
            };
            reader.readAsDataURL(file);
          } else commit(null);
        }

        async function testCamera() {
          const label = $("#cameraStatus");
          if (!label) return;
          if (cameraStream) {
            cameraStream.getTracks().forEach((t) => t.stop());
            cameraStream = null;
            $("#cameraPreview").hidden = true;
            label.textContent = "Cámara apagada.";
            return;
          }
          if (!navigator.mediaDevices?.getUserMedia) {
            label.textContent =
              "Para usar la cámara, permite el acceso en tu navegador.";
            return;
          }
          label.textContent = "Esperando permiso para usar la cámara…";
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: true,
              audio: false,
            });
            if (!$("#cameraPreview")) {
              stream.getTracks().forEach((t) => t.stop());
              return;
            }
            cameraStream = stream;
            $("#cameraPreview").srcObject = stream;
            $("#cameraPreview").hidden = false;
            label.textContent =
              "Vista de cámara activa. Pulsa de nuevo para apagar.";
          } catch {
            if (label.isConnected)
              label.textContent =
                "No se pudo acceder a la cámara. Revisa el permiso del navegador.";
          }
        }
